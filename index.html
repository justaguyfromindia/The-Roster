<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FAFAF8">
<title>Shift Scheduler</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=Fraunces:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* ═══ LIGHT THEME (default) ═══════════════════════════════════════════ */
:root {
  --bg:#FAFAF8;--bg2:#F3F2EE;--bg3:#ECEAE4;
  --border:#E2DFD8;--border2:#CCCAC3;
  --text:#1C1917;--text2:#57534E;--text3:#A8A29E;
  --accent:#E85D26;--accent-bg:#FEF3EE;--accent-text:#9A3412;
  --green:#16A34A;--green-bg:#F0FDF4;--green-text:#15803D;
  --amber:#D97706;--amber-bg:#FFFBEB;--amber-text:#92400E;
  --red:#DC2626;--red-bg:#FEF2F2;--red-text:#991B1B;
  --blue:#2563EB;--blue-bg:#EFF6FF;--blue-text:#1D4ED8;
  --purple:#7C3AED;--purple-bg:#F5F3FF;--purple-text:#4C1D95;
  --shift-s-bg:#FEF9EE;--shift-s-text:#92400E;
  --shift-c-bg:#EFF6FF;--shift-c-text:#1D4ED8;
  --shift-cu-bg:#F5F3FF;--shift-cu-text:#4C1D95;
  --radius:12px;--radius-sm:8px;--radius-xs:6px;
  --shadow:0 1px 3px rgba(0,0,0,.07),0 1px 2px rgba(0,0,0,.05);
  --shadow-md:0 4px 12px rgba(0,0,0,.08),0 2px 4px rgba(0,0,0,.05);
  --font:'DM Sans',system-ui,sans-serif;
  --font-display:'Fraunces',Georgia,serif;
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
/* ═══ DARK THEME ═══════════════════════════════════════════════════════ */
[data-theme="dark"] {
  --bg:#1C1917;--bg2:#292524;--bg3:#3D3634;
  --border:#44403C;--border2:#57534E;
  --text:#FAFAF8;--text2:#A8A29E;--text3:#78716C;
  --accent:#F97316;--accent-bg:#431407;--accent-text:#FDBA74;
  --green:#22C55E;--green-bg:#052E16;--green-text:#86EFAC;
  --amber:#F59E0B;--amber-bg:#451A03;--amber-text:#FCD34D;
  --red:#F87171;--red-bg:#450A0A;--red-text:#FCA5A5;
  --blue:#60A5FA;--blue-bg:#1E3A5F;--blue-text:#93C5FD;
  --purple:#A78BFA;--purple-bg:#2E1065;--purple-text:#C4B5FD;
  --shift-s-bg:#451A03;--shift-s-text:#FCD34D;
  --shift-c-bg:#1E3A5F;--shift-c-text:#93C5FD;
  --shift-cu-bg:#2E1065;--shift-cu-text:#C4B5FD;
  --shadow:0 1px 3px rgba(0,0,0,.3),0 1px 2px rgba(0,0,0,.2);
  --shadow-md:0 4px 12px rgba(0,0,0,.4),0 2px 4px rgba(0,0,0,.3);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;transition:background .2s,color .2s}
.sr-only{position:absolute;width:1px;height:1px;clip:rect(0,0,0,0);overflow:hidden}
/* ─── Setup banner ──────────────────────────────────────────────────── */
#setup-banner{background:var(--amber-bg);border-bottom:1px solid var(--amber);padding:10px 16px;font-size:13px;color:var(--amber-text);display:none;align-items:flex-start;gap:8px}
#setup-banner.show{display:flex}
/* ─── Sync ──────────────────────────────────────────────────────────── */
#sync-status{position:fixed;top:12px;right:12px;font-size:11px;padding:4px 10px;border-radius:20px;z-index:200;display:none}
.sync-status.syncing{display:block;background:var(--blue-bg);color:var(--blue-text)}
.sync-status.saved{display:block;background:var(--green-bg);color:var(--green-text)}
/* ─── Buttons ───────────────────────────────────────────────────────── */
.btn{height:30px;padding:0 12px;border:1px solid var(--border2);border-radius:var(--radius-sm);background:transparent;cursor:pointer;font-size:12px;color:var(--text);font-family:var(--font);display:inline-flex;align-items:center;gap:5px;white-space:nowrap;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.btn:hover,.btn:active{background:var(--bg2)}
.btn:disabled{opacity:.35;pointer-events:none}
.btn.sm{height:32px;padding:0 12px;font-size:12px}
.btn.xs{height:26px;padding:0 9px;font-size:11px}
.btn-p{background:var(--text);color:var(--bg);border-color:var(--text)}
.btn-p:hover,.btn-p:active{opacity:.85;background:var(--text)}
.btn-g{background:var(--green);color:#fff;border-color:var(--green)}
.btn-g:hover{opacity:.88}
.btn-red{background:var(--red-bg);color:var(--red-text);border-color:var(--red)}
.btn.act{background:var(--bg3);border-color:var(--border2)}
/* ─── Inputs ────────────────────────────────────────────────────────── */
.inp{height:44px;width:100%;border:1px solid var(--border2);border-radius:var(--radius-sm);padding:0 14px;font-family:var(--font);font-size:15px;color:var(--text);background:var(--bg);outline:none;transition:border-color .15s}
.inp:focus{border-color:var(--text)}
.inp.pin-inp{font-size:26px;letter-spacing:12px;text-align:center;font-family:monospace;height:56px}
.lbl{font-size:12px;font-weight:500;color:var(--text2);margin-bottom:6px;display:block}
.field{margin-bottom:14px}
.err{font-size:12px;color:var(--red-text);display:none;margin-top:5px}
.err.show{display:block}
/* ─── Layout ────────────────────────────────────────────────────────── */
#app{max-width:780px;margin:0 auto;padding:0 16px 80px}
@media(min-width:640px){#app{padding:0 24px 60px}}
/* ─── Toolbar ───────────────────────────────────────────────────────── */
.tbar{display:flex;align-items:center;justify-content:space-between;padding:14px 0 12px;border-bottom:1px solid var(--border);margin-bottom:16px;gap:8px;flex-wrap:wrap}
.tl,.tr{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.wkn{display:flex;gap:3px}
.wkn button{width:26px;height:26px;border:1px solid var(--border2);background:transparent;border-radius:6px;cursor:pointer;font-size:15px;color:var(--text);display:flex;align-items:center;justify-content:center;font-family:var(--font)}
.wkn button:hover{background:var(--bg2)}
.wklbl{font-size:12px;color:var(--text2);font-weight:500}
/* ─── Cards ─────────────────────────────────────────────────────────── */
.card{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
/* ─── Badges ────────────────────────────────────────────────────────── */
.badge{display:inline-flex;align-items:center;font-size:11px;font-weight:500;padding:2px 7px;border-radius:20px}
.badge-FT{background:var(--shift-s-bg);color:var(--shift-s-text)}
.badge-PT{background:var(--shift-cu-bg);color:var(--shift-cu-text)}
.badge-green{background:var(--green-bg);color:var(--green-text)}
.badge-amber{background:var(--amber-bg);color:var(--amber-text)}
.badge-red{background:var(--red-bg);color:var(--red-text)}
.badge-blue{background:var(--blue-bg);color:var(--blue-text)}
.badge-sup{background:var(--purple-bg);color:var(--purple-text)}
/* ─── Progress ──────────────────────────────────────────────────────── */
.prog-wrap{margin-bottom:14px}
.prog-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px}
.prog-lbl{font-size:13px;color:var(--text2)}
.prog-track{height:3px;background:var(--bg3);border-radius:2px;overflow:hidden}
.prog-fill{height:100%;background:var(--green);border-radius:2px;transition:width .4s}
/* ─── Shift colours ─────────────────────────────────────────────────── */
.shift-span{display:block;text-align:center;padding:2px 3px;border-radius:4px;font-size:10px;width:100%}
.shift-span.s,.ss.s{background:var(--shift-s-bg);color:var(--shift-s-text);border-color:transparent}
.shift-span.c,.ss.c{background:var(--shift-c-bg);color:var(--shift-c-text);border-color:transparent}
.shift-span.cu,.ss.cu{background:var(--shift-cu-bg);color:var(--shift-cu-text);border-color:transparent}
.shift-span.off{color:var(--text3);font-style:italic}
.ss{flex:1;min-width:0;height:26px;border:1px solid var(--border);border-radius:5px;background:var(--bg2);font-size:10px;font-family:var(--font);color:var(--text3);cursor:pointer;padding:0 2px;outline:none}
.ss:hover{border-color:var(--border2)}
.cell-wrap{display:flex;align-items:center;gap:2px}
.ecu-btn{width:20px;height:20px;border:1px solid var(--border2);border-radius:4px;background:transparent;cursor:pointer;font-size:11px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;font-family:var(--font);color:var(--text2)}
.ecu-btn:hover{background:var(--bg2)}
/* ─── Grid ──────────────────────────────────────────────────────────── */
.gw{overflow-x:auto;-webkit-overflow-scrolling:touch}
.sg{width:100%;border-collapse:collapse;table-layout:fixed;min-width:700px}
.sg th{font-size:10px;font-weight:500;color:var(--text3);text-transform:uppercase;letter-spacing:.04em;padding:5px 2px;text-align:center;border-bottom:1px solid var(--border);background:var(--bg2)}
.sg th.nc{text-align:left;padding-left:10px;min-width:140px}
.sg th.hc{min-width:44px}
.sg th.ac{min-width:68px}
.sg th.today-h{background:var(--blue-bg);color:var(--blue-text)}
.sg td{padding:2px;border-bottom:1px solid var(--border);vertical-align:middle}
.sg td.nc{padding:4px 2px 4px 10px}
.sg tr:last-child td{border-bottom:none}
.today-col{background:color-mix(in srgb,var(--blue) 7%,transparent)!important}
.hrs-cell{text-align:center;font-size:12px;font-weight:500;color:var(--text2)}
.hrs-zero{color:var(--text3);font-weight:400}
.status-ok{font-size:10px;background:var(--green-bg);color:var(--green-text);padding:2px 7px;border-radius:20px;white-space:nowrap;display:inline-block}
/* ─── Staff name cell ───────────────────────────────────────────────── */
.snm-wrap{display:flex;align-items:center;gap:4px;margin-bottom:2px;flex-wrap:wrap}
.snm{font-size:13px;font-weight:500;cursor:pointer;border-bottom:1px dashed transparent;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:80px;display:inline-block;color:var(--text)}
.snm:hover{border-bottom-color:var(--border2)}
.snm-inp{width:100%;height:24px;border:1px solid var(--border2);border-radius:4px;padding:0 6px;font-size:12px;font-family:var(--font);outline:none;display:none;background:var(--bg);color:var(--text)}
.snm-sub{font-size:10px;color:var(--text3)}
/* ─── Role section ──────────────────────────────────────────────────── */
.rsec{margin-bottom:16px;border-radius:var(--radius);border:1px solid transparent;transition:border-color .15s,opacity .15s}
.rsec.drag-over{border-color:var(--blue);background:color-mix(in srgb,var(--blue) 4%,transparent)}
.rsec.dragging{opacity:.4}
.rhdr{display:flex;align-items:center;justify-content:space-between;padding:6px 10px;background:var(--bg2);border-radius:var(--radius-sm);margin-bottom:4px;user-select:none}
.dhnd{display:flex;flex-direction:column;gap:2px;cursor:grab;padding:2px 4px;opacity:.4;flex-shrink:0}
.dhnd:hover{opacity:.8}
.dhnd:active{cursor:grabbing}
.dhl{width:12px;height:1.5px;background:var(--text2);border-radius:1px}
.rlft{display:flex;align-items:center;gap:7px}
.rnm{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text2)}
.rct{font-size:11px;color:var(--text3)}
.rmin-badge{font-size:10px;padding:1px 6px;border-radius:10px;background:var(--bg3);border:1px solid var(--border);color:var(--text3)}
.rrgt{display:flex;align-items:center;gap:4px}
.obtn{width:22px;height:22px;border:1px solid var(--border2);background:transparent;border-radius:4px;cursor:pointer;font-size:11px;color:var(--text2);display:flex;align-items:center;justify-content:center;font-family:var(--font)}
.obtn:hover{background:var(--bg)}
.obtn:disabled{opacity:.2;pointer-events:none}
.er td{text-align:center;padding:12px;color:var(--text3);font-size:12px;font-style:italic}
.add-row td{padding:4px 2px}
.add-inp{height:26px;width:100%;border:1px solid var(--border2);border-radius:5px;padding:0 8px;font-size:12px;font-family:var(--font);outline:none;background:var(--bg);color:var(--text)}
/* ─── Custom editor + copy panel ────────────────────────────────────── */
.panel-box{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--radius);padding:14px 16px;margin-bottom:14px}
.panel-title{font-size:14px;font-weight:500;margin-bottom:10px;color:var(--text)}
.curow{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.cufield{flex:1;min-width:110px}
.time-inp{height:36px;width:100%;border:1px solid var(--border2);border-radius:var(--radius-xs);padding:0 10px;font-size:14px;font-family:var(--font);outline:none;background:var(--bg);color:var(--text)}
.time-inp:focus{border-color:var(--text)}
.cu-hrs{font-size:12px;color:var(--text2);padding-bottom:5px}
.cu-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.day-checks{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.day-chk-lbl{display:flex;align-items:center;gap:5px;font-size:13px;padding:6px 10px;border:1px solid var(--border2);border-radius:var(--radius-xs);cursor:pointer;background:var(--bg);user-select:none}
.day-chk-lbl input{accent-color:var(--accent);width:14px;height:14px}
.day-chk-lbl.has{opacity:.55}
.note-textarea{width:100%;height:48px;border:1px solid var(--border2);border-radius:var(--radius-xs);padding:6px 8px;font-size:12px;font-family:var(--font);resize:none;outline:none;background:var(--bg);color:var(--text)}
.note-textarea:focus{border-color:var(--text)}
/* ─── Requirements + Deadline panels ────────────────────────────────── */
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:8px}
.rrow{display:flex;align-items:center;justify-content:space-between;padding:7px 12px;background:var(--bg2);border-radius:var(--radius-xs)}
.rrole{font-size:12px;font-weight:500;color:var(--text)}
.rctl{display:flex;align-items:center;gap:6px}
.rbtn{width:22px;height:22px;border:1px solid var(--border2);border-radius:4px;background:transparent;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;font-family:var(--font);color:var(--text)}
.rbtn:hover{background:var(--bg)}
.rval{font-size:14px;font-weight:500;min-width:22px;text-align:center;color:var(--text)}
.dl-inp{height:36px;border:1px solid var(--border2);border-radius:var(--radius-xs);padding:0 10px;font-size:13px;font-family:var(--font);outline:none;background:var(--bg);color:var(--text)}
.dl-inp:focus{border-color:var(--text)}
.dl-bdg{font-size:11px;padding:3px 9px;border-radius:20px}
/* ─── Results ───────────────────────────────────────────────────────── */
.dtabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:14px;overflow-x:auto;padding-bottom:2px}
.dtab{height:32px;padding:0 10px;border:1px solid var(--border2);border-radius:var(--radius-sm);background:transparent;cursor:pointer;font-size:12px;font-weight:500;color:var(--text2);font-family:var(--font);white-space:nowrap;flex-shrink:0}
.dtab.act{background:var(--text);color:var(--bg);border-color:var(--text)}
.dtab.wi{border-color:var(--amber);color:var(--amber-text)}
.dtab.act.wi{background:var(--amber-bg);border-color:var(--amber);color:var(--amber-text)}
.rcard{border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;margin-bottom:8px;background:var(--bg)}
.rcardh{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:13px;font-weight:500;flex-wrap:wrap}
.sdot{width:9px;height:9px;border-radius:2px;flex-shrink:0}
.rtime{font-size:11px;color:var(--text2);font-family:monospace;font-weight:400}
.rct2{margin-left:auto;font-size:11px;color:var(--text3)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border:1px solid var(--border);border-radius:20px;background:var(--bg2);margin:3px;font-size:12px}
.chav{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:600;flex-shrink:0}
.chsub{font-size:10px;color:var(--text3)}
.ctag{font-size:10px;padding:1px 5px;border-radius:10px;margin-left:2px}
.tag-adj{background:var(--amber-bg);color:var(--amber-text)}
.tag-fi{background:var(--red-bg);color:var(--red-text)}
.tag-ovr{background:var(--purple-bg);color:var(--purple-text)}
.tag-over{background:var(--red-bg);color:var(--red-text)}
.scchk{margin-top:10px;padding:10px 12px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--bg2)}
.scchk-t{font-size:11px;font-weight:600;color:var(--text2);margin-bottom:6px}
.scc-grid{display:flex;flex-wrap:wrap;gap:5px}
.sci{font-size:11px;padding:3px 8px;border-radius:20px}
.sci-ok{background:var(--green-bg);color:var(--green-text)}
.sci-bad{background:var(--red-bg);color:var(--red-text)}
.off-lbl{font-size:11px;color:var(--text3);margin-top:6px;padding-top:6px;border-top:1px solid var(--border)}
.edit-toggle-wrap{margin-top:8px;padding-top:8px;border-top:1px solid var(--border);display:none}
.ear{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.earn{font-size:12px;font-weight:500;min-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)}
/* ─── Suggestion banner ─────────────────────────────────────────────── */
.sugg-banner{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--radius);padding:14px 16px;margin-bottom:16px}
.sugg-title{font-size:14px;font-weight:600;margin-bottom:4px;color:var(--text)}
.sugg-sub{font-size:12px;color:var(--text2);margin-bottom:10px}
.sugg-stats{display:flex;gap:6px;flex-wrap:wrap}
.sstat{font-size:11px;padding:3px 9px;border-radius:20px}
.sstat-ok{background:var(--green-bg);color:var(--green-text)}
.sstat-wi{background:var(--amber-bg);color:var(--amber-text)}
.sstat-info{background:var(--blue-bg);color:var(--blue-text)}
.diff-list{margin-top:10px;border:1px solid var(--border);border-radius:var(--radius-xs);background:var(--bg);overflow:hidden}
.diff-item{display:flex;align-items:flex-start;gap:8px;padding:8px 12px;border-bottom:1px solid var(--border);font-size:12px;color:var(--text)}
.diff-item:last-child{border-bottom:none}
.diff-tag{font-size:10px;padding:2px 6px;border-radius:10px;flex-shrink:0;margin-top:2px;white-space:nowrap}
/* ─── Landing ───────────────────────────────────────────────────────── */
.land{display:flex;flex-direction:column;align-items:center;gap:24px;padding:40px 16px;text-align:center}
.land-logo{font-family:var(--font-display);font-size:32px;font-weight:300;color:var(--text);margin-bottom:6px;line-height:1.2}
.land-sub{font-size:13px;color:var(--text3);margin-bottom:8px}
.land-cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:360px;margin:0 auto}
@media(max-width:380px){.land-cards{grid-template-columns:1fr}}
.lcard{padding:22px 16px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg);cursor:pointer;transition:border-color .15s,box-shadow .15s;text-align:center;-webkit-tap-highlight-color:transparent}
.lcard:hover,.lcard:active{border-color:var(--text);box-shadow:var(--shadow-md)}
.lcard-icon{font-size:26px;margin-bottom:10px}
.lcard-t{font-size:14px;font-weight:600;margin-bottom:4px;color:var(--text)}
.lcard-d{font-size:11px;color:var(--text3);line-height:1.4}
.dl-pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:6px 14px;border-radius:20px;margin-top:2px}
/* ─── Auth ──────────────────────────────────────────────────────────── */
.auth-wrap{max-width:340px;margin:36px auto 0;padding:0 4px}
.auth-title{font-family:var(--font-display);font-size:22px;font-weight:300;text-align:center;margin-bottom:6px;color:var(--text)}
.auth-sub{font-size:13px;color:var(--text2);text-align:center;margin-bottom:22px;line-height:1.5}
.auth-av{width:54px;height:54px;border-radius:50%;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:18px;margin:0 auto 14px;color:var(--text2)}
/* ─── Employee list ─────────────────────────────────────────────────── */
.emp-list{max-width:460px;margin:0 auto}
.emp-item{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:8px;background:var(--bg);cursor:pointer;transition:border-color .15s;-webkit-tap-highlight-color:transparent}
.emp-item:not(.emp-done):hover,.emp-item:not(.emp-done):active{border-color:var(--text)}
.emp-done{opacity:.6;cursor:default}
.emp-nm{font-size:14px;font-weight:500;margin-bottom:2px;color:var(--text)}
.emp-role{font-size:12px;color:var(--text3)}
/* ─── Emp form ──────────────────────────────────────────────────────── */
.ep-nm{font-family:var(--font-display);font-size:22px;font-weight:300;color:var(--text)}
.ep-role{font-size:13px;color:var(--text2);margin-top:3px}
.dl-banner{display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:var(--radius-sm);font-size:13px;margin-bottom:14px}
.dl-banner.amber{background:var(--amber-bg);color:var(--amber-text);border:1px solid var(--amber)}
.dl-banner.red{background:var(--red-bg);color:var(--red-text);border:1px solid var(--red)}
/* ─── Done screen ───────────────────────────────────────────────────── */
.done-wrap{display:flex;flex-direction:column;align-items:center;text-align:center;padding:48px 20px;gap:10px}
.done-icon{font-size:44px;margin-bottom:4px}
.done-title{font-family:var(--font-display);font-size:22px;font-weight:300;color:var(--text)}
.done-sub{font-size:14px;color:var(--text2)}
.done-meta{font-size:12px;color:var(--text3)}
.done-actions{display:flex;flex-direction:column;gap:8px;width:100%;max-width:260px;margin-top:8px}
/* ─── Archive ───────────────────────────────────────────────────────── */
.archive-sec{margin-top:18px;padding:12px 14px;border:1px dashed var(--border2);border-radius:var(--radius);background:var(--bg2)}
.archive-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.archive-title{font-size:12px;font-weight:500;color:var(--text3);text-transform:uppercase;letter-spacing:.06em}
/* ─── Hours cap warning ─────────────────────────────────────────────── */
/* ─── Sticky bar ────────────────────────────────────────────────────── */
.sticky-bar{position:fixed;bottom:0;left:0;right:0;padding:12px 16px;padding-bottom:calc(12px + var(--safe-bottom));background:var(--bg);border-top:1px solid var(--border);box-shadow:0 -4px 12px rgba(0,0,0,.06);z-index:100}
.sticky-bar .btn{width:100%;justify-content:center;height:46px;font-size:15px}
@media(min-width:640px){.sticky-bar{display:none}.desktop-submit{display:flex;justify-content:center;margin-top:12px}}
@media(max-width:639px){.desktop-submit{display:none}body{padding-bottom:80px}}
/* ─── Public view ───────────────────────────────────────────────────── */
.pub-hdr{background:var(--text);color:var(--bg);padding:14px 16px;border-radius:var(--radius-sm);margin-bottom:16px;display:flex;align-items:center;justify-content:space-between}
.pub-title{font-family:var(--font-display);font-size:18px;font-weight:300}
.pub-card{border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px;margin-bottom:8px;background:var(--bg)}
.pub-role{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--text3);margin-bottom:8px}
.pub-staff{display:flex;flex-wrap:wrap;gap:6px}
.pub-chip{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border:1px solid var(--border);border-radius:20px;background:var(--bg2);font-size:12px}
/* ─── Notes panel ────────────────────────────────────────────────────── */
.notes-panel{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:14px}
.notes-panel-title{font-size:13px;font-weight:600;color:var(--text);margin-bottom:4px}
.notes-panel-sub{font-size:12px;color:var(--text3);margin-bottom:12px}
.note-row{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:7px;background:var(--bg2)}
.note-row-left{flex:1;min-width:0}
.note-staff{font-size:13px;font-weight:500;color:var(--text)}
.note-day{font-size:11px;color:var(--text3);margin-bottom:3px}
.note-text{font-size:13px;color:var(--text2);background:var(--amber-bg);color:var(--amber-text);padding:4px 9px;border-radius:var(--radius-xs);display:inline-block}
.no-notes{text-align:center;padding:20px;color:var(--text3);font-size:13px;font-style:italic}
/* ─── Loading ───────────────────────────────────────────────────────── */
.spinner{width:36px;height:36px;border:2.5px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;margin:60px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-wrap{text-align:center;padding:48px 20px}
.loading-txt{font-size:13px;color:var(--text3);margin-top:12px}
/* ─── Legend ────────────────────────────────────────────────────────── */
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--border)}
.legi{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text2)}
.legd{width:9px;height:9px;border-radius:2px}
/* ─── Dark mode toggle ──────────────────────────────────────────────── */
.dm-btn{width:32px;height:32px;border:1px solid var(--border2);border-radius:50%;background:transparent;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;position:fixed;top:12px;left:12px;z-index:300;background:var(--bg);box-shadow:var(--shadow)}
.dm-btn:hover{background:var(--bg2)}
/* ─── Print ─────────────────────────────────────────────────────────── */
@media print{
  .dm-btn,#sync-status,#setup-banner,.sticky-bar,.tbar .tr,.dhnd,.obtn,.addbtn,.add-btn,.ep-actions,.add-row,.legend,
  .panel-box,.sugg-banner,.prog-wrap,.dl-banner,.rcard .edit-toggle-wrap,
  button:not(.print-keep){display:none!important}
  body{padding-bottom:0!important;font-size:11px}
  #app{max-width:100%;padding:0 8px}
  .sg{min-width:0;font-size:10px}
  .rcard{break-inside:avoid;border:1px solid #ccc;padding:8px;margin-bottom:6px}
}
</style>
</head>
<body>
<button class="dm-btn" id="dm-btn" title="Toggle dark mode" onclick="toggleDark()">🌙</button>
<div id="setup-banner">⚠️ <div><strong>Running in offline mode.</strong> Could not connect to the database — data is saved on this device only. Check your connection.</div></div>
<div id="sync-status" class="sync-status"></div>
<div id="app"><div class="loading-wrap"><div class="spinner"></div><div class="loading-txt">Loading…</div></div></div>
<script>
// ═══ CONFIGURATION — update DB_URL to your Firebase project ════════════
const DB_URL='https://the-roster-87c07-default-rtdb.europe-west1.firebasedatabase.app/roster_app';
const MANAGER_PIN='1234';     // Full access
const SUPERVISOR_PIN='5678';  // View-only + submit on behalf, no config changes
// ══════════════════════════════════════════════════════════════════════

const ROLES_DEF=['Manager','Assistant Manager','Floor Staff','Kitchen Porter','Bar Staff','Receptionist'];
const DAYS=['Thu','Fri','Sat','Sun','Mon','Tue','Wed'];
const SEN={Manager:1,'Assistant Manager':2,'Floor Staff':3,'Kitchen Porter':4,'Bar Staff':5,Receptionist:6};

// ─── Firebase REST ─────────────────────────────────────────────────────
let USE_FIREBASE=false,pollTimer=null;
async function initDB(){
  try{
    const ctrl=new AbortController(),tid=setTimeout(()=>ctrl.abort(),5000);
    const r=await fetch(`${DB_URL}.json`,{signal:ctrl.signal});
    clearTimeout(tid);
    if(r.ok){USE_FIREBASE=true;return;}
  }catch(e){}
  console.info('Firebase unreachable — offline mode');
  document.getElementById('setup-banner').classList.add('show');
}
async function dbGet(path){
  if(USE_FIREBASE){
    try{
      const ctrl=new AbortController(),tid=setTimeout(()=>ctrl.abort(),6000);
      const url=path?`${DB_URL}/${path}.json`:`${DB_URL}.json`;
      const r=await fetch(url,{signal:ctrl.signal});clearTimeout(tid);
      if(!r.ok)return null;
      const d=await r.json();return d===null||d===undefined?null:d;
    }catch(e){console.warn('dbGet failed:',path,e);return null;}
  }else{return getNested(getLocalStore(),path.split('/'));}
}
async function dbSet(path,value){
  if(USE_FIREBASE){
    try{
      showSync('syncing');
      const ctrl=new AbortController(),tid=setTimeout(()=>ctrl.abort(),6000);
      const url=path?`${DB_URL}/${path}.json`:`${DB_URL}.json`;
      await fetch(url,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(value),signal:ctrl.signal});
      clearTimeout(tid);showSync('saved');
    }catch(e){console.warn('dbSet failed:',path,e);showSync('');}
  }else{const s=getLocalStore();setNested(s,path.split('/'),value);localStorage.setItem('roster_app',JSON.stringify(s));}
}
async function dbRemove(path){
  if(USE_FIREBASE){
    try{const url=path?`${DB_URL}/${path}.json`:`${DB_URL}.json`;await fetch(url,{method:'DELETE'});}catch(e){console.warn('dbRemove:',e);}
  }else{const s=getLocalStore();removeNested(s,path.split('/'));localStorage.setItem('roster_app',JSON.stringify(s));}
}
function startPolling(){
  if(!USE_FIREBASE)return;
  if(pollTimer)clearInterval(pollTimer);
  pollTimer=setInterval(async()=>{
    if(VIEW==='loading')return;
    const snap=await dbGet('');if(snap)applySnapshot(snap);
  },5000);
}
function applySnapshot(snap){
  if(!snap)return;let changed=false;
  if(snap.staff){const ns=Object.values(snap.staff).filter(Boolean);if(JSON.stringify(ns)!==JSON.stringify(STAFF)){STAFF=ns;changed=true;}}
  if(snap.nextId)NEXT_ID=snap.nextId;
  if(snap.rord&&JSON.stringify(snap.rord)!==JSON.stringify(RORD)){RORD=snap.rord;changed=true;}
  if(snap.mins){const nm={...{Manager:1,'Assistant Manager':2,'Floor Staff':4,'Kitchen Porter':2,'Bar Staff':1,Receptionist:2},...snap.mins};if(JSON.stringify(nm)!==JSON.stringify(MINS)){MINS=nm;changed=true;}}
  if(snap.deadline!==undefined)DEADLINE=snap.deadline||null;
  if(snap.alloc)ALLOC=snap.alloc;
  if(snap.ovr)OVR=snap.ovr;
  if(snap.pins)Object.keys(snap.pins).forEach(id=>{hasPINcache[id]=true;});
  if(snap.publicRoster)PUB_ROSTER=snap.publicRoster;
  if(snap.history)HISTORY=snap.history;
  const busy=ADD_RI!==null||CU_EDITOR!==null||(document.activeElement&&document.activeElement.tagName==='INPUT'&&!['emp-pin','mgr-pin','pc1','pc2','pent'].includes(document.activeElement.id))||(document.activeElement&&document.activeElement.tagName==='TEXTAREA');
  if(changed&&VIEW!=='loading'&&!busy)render();
}
function getLocalStore(){try{return JSON.parse(localStorage.getItem('roster_app')||'{}');}catch{return {};}}
function getNested(obj,keys){return keys.reduce((o,k)=>(o&&o[k]!==undefined?o[k]:null),obj);}
function setNested(obj,keys,value){const ks=[...keys];const last=ks.pop();const p=ks.reduce((o,k)=>{if(!o[k]||typeof o[k]!=='object')o[k]={};return o[k];},obj);p[last]=value;}
function removeNested(obj,keys){const ks=[...keys];const last=ks.pop();const p=ks.reduce((o,k)=>(o&&o[k]?o[k]:{}),obj);if(p)delete p[last];}
let syncTimer=null;
function showSync(state){
  const el=document.getElementById('sync-status');if(!el)return;
  el.className='sync-status '+state;el.textContent=state==='syncing'?'⟳ Syncing…':state==='saved'?'✓ Saved':'';
  clearTimeout(syncTimer);if(state==='saved')syncTimer=setTimeout(()=>{if(el)el.className='sync-status';},2000);
}

// ─── PIN ───────────────────────────────────────────────────────────────
async function hashPIN(pin){
  const enc=new TextEncoder().encode(pin+'_roster_salt');
  const hash=await crypto.subtle.digest('SHA-256',enc);
  return Array.from(new Uint8Array(hash)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function savePin(id,pin){await dbSet('pins/'+id,await hashPIN(pin));}
async function hasPin(id){return !!(await dbGet('pins/'+id));}
async function checkPin(id,pin){const s=await dbGet('pins/'+id);if(!s)return false;return s===await hashPIN(pin);}

// ─── State ────────────────────────────────────────────────────────────
let VIEW='loading',EMP_ID=null,WK_OFF=0,MGR_TAB='prefs',RES_DAY=0;
let SHOW_REQ=false,SHOW_DL=false,SHOW_DIFF=false,SHOW_ARCHIVE=false,SHOW_NOTES=false;
let ADD_RI=null,DSRC=null,CU_EDITOR=null,COPY_PENDING=null;
let NOTE_EDITING=null; // {staffId, dayIdx}
let ALLOC={},OVR={},DIFF=[];
let STAFF=[],RORD=[...ROLES_DEF];
let MINS={Manager:1,'Assistant Manager':2,'Floor Staff':4,'Kitchen Porter':2,'Bar Staff':1,Receptionist:2};
let DEADLINE=null,NEXT_ID=4;
let MGR_LEVEL='manager'; // 'manager' or 'supervisor'
let DARK_MODE=false;
let PUB_ROSTER=null; // published snapshot
let HISTORY={}; // {wkKey: {staffId:[prefs]}}
let hasPINcache={};

// ─── Dark mode ────────────────────────────────────────────────────────
function toggleDark(){
  DARK_MODE=!DARK_MODE;
  document.documentElement.setAttribute('data-theme',DARK_MODE?'dark':'light');
  const btn=document.getElementById('dm-btn');
  if(btn)btn.textContent=DARK_MODE?'☀️':'🌙';
  try{localStorage.setItem('roster_dark',DARK_MODE?'1':'0');}catch(e){}
}
function initDark(){
  try{DARK_MODE=localStorage.getItem('roster_dark')==='1';}catch(e){}
  if(DARK_MODE){document.documentElement.setAttribute('data-theme','dark');const btn=document.getElementById('dm-btn');if(btn)btn.textContent='☀️';}
}

// ─── Date helpers ─────────────────────────────────────────────────────
function getWeekStart(off){const d=new Date(),day=d.getDay();d.setDate(d.getDate()-(day+3)%7+off*7);d.setHours(0,0,0,0);return d;}
function fmtDate(d){return d.toLocaleDateString('en-IE',{day:'numeric',month:'short'});}
function fmtDT(d){return d.toLocaleDateString('en-IE',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});}
function todayCol(){const t=new Date();t.setHours(0,0,0,0);const th=getWeekStart(WK_OFF);for(let i=0;i<7;i++){const d=new Date(th);d.setDate(th.getDate()+i);if(d.getTime()===t.getTime())return i;}return -1;}
function wkHdr(){const th=getWeekStart(WK_OFF),e=new Date(th);e.setDate(th.getDate()+6);return`${fmtDate(th)} – ${fmtDate(e)}`;}
function wkKey(off){const d=getWeekStart(off);return`${d.getFullYear()}-W${String(Math.ceil(((d-new Date(d.getFullYear(),0,1))/86400000+1)/7)).padStart(2,'0')}`;}
function isPastDL(){return DEADLINE?new Date()>new Date(DEADLINE):false;}
function dlLabel(){return DEADLINE?fmtDT(new Date(DEADLINE)):null;}
function timeUntilDL(){if(!DEADLINE)return null;const diff=new Date(DEADLINE)-new Date();if(diff<=0)return null;const h=Math.floor(diff/3600000),m=Math.floor((diff%3600000)/60000);if(h>48)return`${Math.floor(h/24)} days remaining`;if(h>0)return`${h}h ${m}m remaining`;return`${m}m remaining`;}

// ─── Shift helpers ────────────────────────────────────────────────────
function mkP(){return Array(7).fill(null).map(()=>({type:'',s:'',e:'',note:''}));}
function pH(p){if(!p||!p.type)return 0;if(p.type==='s')return 8.5;if(p.type==='c')return 9;if(p.type==='custom'&&p.s&&p.e){const[sh,sm]=p.s.split(':').map(Number),[eh,em]=p.e.split(':').map(Number);let m=(eh*60+em)-(sh*60+sm);if(m<=0)m+=1440;return Math.round(m*10/60)/10;}return 0;}
function totalH(s,src){const pr=src==='a'?(ALLOC[s.id]||s.prefs):s.prefs;return pr.reduce((sum,p)=>sum+pH(p),0);}
function sLbl(p){if(!p||!p.type)return 'Off';if(p.type==='s')return 'Starting';if(p.type==='c')return 'Closing';if(p.type==='custom'&&p.s)return fmt12(p.s)+'–'+fmt12(p.e);return 'Off';}
function sCls(p){return!p||!p.type?'':p.type==='s'?'s':p.type==='c'?'c':p.type==='custom'?'cu':'';}
function fmt12(t){if(!t)return '';const[h,m]=t.split(':').map(Number);const ap=h<12?'am':'pm',hh=h%12||12;return m===0?`${hh}${ap}`:`${hh}:${String(m).padStart(2,'0')}${ap}`;}
function fmtH(h){return h===0?'—':h===Math.floor(h)?h+'h':h.toFixed(1)+'h';}
function inits(n){return(n||'').split(' ').filter(Boolean).map(p=>p[0]).join('').slice(0,2).toUpperCase()||'?';}
function subCt(){return STAFF.filter(s=>!s.archived&&s.sub).length;}
function activeStaff(){return STAFF.filter(s=>!s.archived);}
function allSub(){const a=activeStaff();return a.length>0&&a.every(s=>s.sub);}
function isSupervisor(){return MGR_LEVEL==='supervisor';}

// ─── Data persistence ─────────────────────────────────────────────────
async function loadAll(){
  if(USE_FIREBASE){const snap=await dbGet('');if(snap)applySnapshot(snap);return;}
  const d=getLocalStore();
  if(d.staff){STAFF=Object.values(d.staff).filter(Boolean);NEXT_ID=d.nextId||(STAFF.length?Math.max(...STAFF.map(s=>s.id))+1:4);}
  if(d.rord)RORD=d.rord;
  if(d.mins)MINS={...MINS,...d.mins};
  if(d.deadline)DEADLINE=d.deadline;
  if(d.alloc)ALLOC=d.alloc;
  if(d.ovr)OVR=d.ovr;
  if(d.pins)Object.keys(d.pins).forEach(id=>{hasPINcache[id]=true;});
  if(d.publicRoster)PUB_ROSTER=d.publicRoster;
  if(d.history)HISTORY=d.history;
}
function setupListeners(){startPolling();}
async function saveStaff(){const o={};STAFF.forEach(s=>{o[s.id]=s;});await dbSet('staff',o);await dbSet('nextId',NEXT_ID);}
async function saveSettings(){await dbSet('rord',RORD);await dbSet('mins',MINS);if(DEADLINE)await dbSet('deadline',DEADLINE);else await dbRemove('deadline');}
async function saveAlloc(){await dbSet('alloc',ALLOC);await dbSet('ovr',OVR);}
async function saveHistory(){await dbSet('history',HISTORY);}

// ─── Week-to-week copy ────────────────────────────────────────────────
async function copyLastWeek(){
  const lastKey=wkKey(WK_OFF-1);
  const lastHist=HISTORY[lastKey];
  if(!lastHist){alert('No roster found for the previous week.');return;}
  if(!confirm('Copy last week\'s shifts as preferences for this week? This will only update staff who haven\'t submitted yet.'))return;
  let count=0;
  activeStaff().forEach(s=>{
    if(s.sub)return;
    const lp=lastHist[s.id];
    if(lp&&Array.isArray(lp)){
      s.prefs=lp.map(p=>({...p,note:''})); // clear notes, keep shift types
      count++;
    }
  });
  await saveStaff();
  alert(`Copied last week\'s shifts to ${count} staff member(s) as preferences.`);
  render();
}
async function saveToHistory(){
  const key=wkKey(WK_OFF);
  if(!HISTORY)HISTORY={};
  HISTORY[key]={};
  activeStaff().forEach(s=>{HISTORY[key][s.id]=s.prefs.map(p=>({...p}));});
  await saveHistory();
}

// ─── Publish public roster ────────────────────────────────────────────
async function publishRoster(){
  if(!confirm('Publish the current roster so staff can view it via the public link?'))return;
  const th=getWeekStart(WK_OFF),e=new Date(th);e.setDate(th.getDate()+6);
  PUB_ROSTER={wk:wkHdr(),alloc:{},staff:{},publishedAt:new Date().toISOString()};
  activeStaff().forEach(s=>{
    PUB_ROSTER.staff[s.id]={name:s.name,role:s.role,emp:s.emp};
    PUB_ROSTER.alloc[s.id]=(ALLOC[s.id]||s.prefs).map(p=>({...p}));
  });
  await dbSet('publicRoster',PUB_ROSTER);
  const url=window.location.href.split('?')[0]+'?public=1';
  await navigator.clipboard.writeText(url).catch(()=>{});
  alert('Roster published! Link copied to clipboard:\n'+url);
}

// ─── Shift setters ────────────────────────────────────────────────────
async function setPref(id,di,val){
  const s=STAFF.find(x=>x.id===id);if(!s||s.sub)return;
  if(val==='custom'){CU_EDITOR={staffId:id,dayIdx:di,isA:false,prevP:{...s.prefs[di]}};s.prefs[di]={type:'custom',s:'09:00',e:'17:00',note:s.prefs[di].note||''};render();return;}
  s.prefs[di]={...s.prefs[di],type:val==='s'?'s':val==='c'?'c':'',s:val==='s'?'04:00':val==='c'?'12:30':'',e:val==='s'?'12:30':val==='c'?'21:30':''};
  await saveStaff();render();
}
async function setAlloc(id,di,val){
  const s=STAFF.find(x=>x.id===id);if(!s)return;
  if(!ALLOC[id])ALLOC[id]=s.prefs.map(p=>({...p}));
  if(val==='custom'){CU_EDITOR={staffId:id,dayIdx:di,isA:true,prevP:{...(ALLOC[id][di]||{type:'',s:'',e:'',note:''})}};ALLOC[id][di]={type:'custom',s:'09:00',e:'17:00',note:''};if(!OVR[id])OVR[id]=Array(7).fill(false);OVR[id][di]=true;render();return;}
  ALLOC[id][di]={...(ALLOC[id][di]||{}),type:val==='s'?'s':val==='c'?'c':'',s:val==='s'?'04:00':val==='c'?'12:30':'',e:val==='s'?'12:30':val==='c'?'21:30':''};
  if(!OVR[id])OVR[id]=Array(7).fill(false);OVR[id][di]=true;
  await saveAlloc();render();
}
function openCuEditor(id,di,isA){
  const s=STAFF.find(x=>x.id===id);if(!s)return;
  const pr=isA?(ALLOC[id]||s.prefs):s.prefs,p=pr[di]||{type:'',s:'',e:'',note:''};
  CU_EDITOR={staffId:id,dayIdx:di,isA,prevP:{...p}};
  if(isA){if(!ALLOC[id])ALLOC[id]=s.prefs.map(q=>({...q}));ALLOC[id][di]={...p,type:'custom',s:p.s||'09:00',e:p.e||'17:00'};}
  else s.prefs[di]={...p,type:'custom',s:p.s||'09:00',e:p.e||'17:00'};
  render();
}
async function cfCu(){
  if(!CU_EDITOR)return;
  const si=document.getElementById('cu-s'),ei=document.getElementById('cu-e');if(!si||!ei)return;
  const sv=si.value,ev=ei.value;if(!sv||!ev)return;

// ─── Allocation engine ─────────────────────────────────────────────────
function calcAlloc(){
  ALLOC={};OVR={};DIFF=[];
  activeStaff().forEach(s=>{ALLOC[s.id]=s.prefs.map(p=>({...p}));});
  for(let d=0;d<7;d++){
    ROLES_DEF.forEach(r=>{
      const mn=MINS[r]||0;if(!mn)return;
      const rs=activeStaff().filter(s=>s.role===r);
      const wk=rs.filter(s=>ALLOC[s.id]&&ALLOC[s.id][d]&&ALLOC[s.id][d].type);
      const nd=mn-wk.length;if(nd<=0)return;
      rs.filter(s=>!ALLOC[s.id]||!ALLOC[s.id][d]||!ALLOC[s.id][d].type).slice(0,nd).forEach(s=>{
        const wp=s.prefs.filter(p=>p&&p.type);
        const mc=wp.length>0?{...wp.sort((a,b)=>wp.filter(v=>v.type===b.type).length-wp.filter(v=>v.type===a.type).length)[0]}:{type:'c',s:'12:30',e:'21:30',note:''};
        ALLOC[s.id][d]={...mc};DIFF.push({id:s.id,name:s.name,role:s.role,day:d,was:{type:''},now:{...mc},reason:'fi'});
      });
    });
    const ac=activeStaff().filter(s=>ALLOC[s.id]&&ALLOC[s.id][d]&&ALLOC[s.id][d].type);
    if(ac.length<2)continue;
    const getG=()=>{const b={s:[],c:[],custom:[]};ac.forEach(s=>{const t=ALLOC[s.id][d].type;if(b[t])b[t].push(s);});return b;};
    let g=getG();
    if(g.s.length===0){const pool=[...g.c,...g.custom].filter(x=>x.role!=='Manager').sort((a,b)=>SEN[b.role]-SEN[a.role]);if(pool.length>0){const prev={...ALLOC[pool[0].id][d]},np={type:'s',s:'04:00',e:'12:30',note:''};ALLOC[pool[0].id][d]=np;const op=pool[0].prefs[d];if(op&&op.type&&op.type!=='s')DIFF.push({id:pool[0].id,name:pool[0].name,role:pool[0].role,day:d,was:prev,now:np,reason:'adj'});}}
    g=getG();
    if(g.c.length+g.custom.length===0){const pool=[...g.s].filter(x=>x.role!=='Manager').sort((a,b)=>SEN[b.role]-SEN[a.role]);if(pool.length>0){const prev={...ALLOC[pool[0].id][d]},np={type:'c',s:'12:30',e:'21:30',note:''};ALLOC[pool[0].id][d]=np;const op=pool[0].prefs[d];if(op&&op.type&&op.type!=='c')DIFF.push({id:pool[0].id,name:pool[0].name,role:pool[0].role,day:d,was:prev,now:np,reason:'adj'});}}
  }
}

function setupDrag(){
  document.querySelectorAll('.rsec[data-ri]').forEach(sec=>{
    const h=sec.querySelector('.dhnd');
    if(h){h.addEventListener('mousedown',()=>sec.setAttribute('draggable','true'));h.addEventListener('mouseup',()=>sec.setAttribute('draggable','false'));}
    sec.addEventListener('dragstart',e=>{DSRC=parseInt(sec.dataset.ri);e.dataTransfer.effectAllowed='move';setTimeout(()=>sec.classList.add('dragging'),0);});
    sec.addEventListener('dragend',()=>{sec.classList.remove('dragging');sec.setAttribute('draggable','false');document.querySelectorAll('.rsec').forEach(s=>s.classList.remove('drag-over'));DSRC=null;});

function exportExcel(){
  if(typeof XLSX==='undefined'){alert('Excel library not loaded yet.');return;}
  const th=getWeekStart(WK_OFF),e=new Date(th);e.setDate(th.getDate()+6);const wl=`${fmtDate(th)} – ${fmtDate(e)}`;
  const dhs=DAYS.map((d,i)=>{const dd=new Date(th);dd.setDate(th.getDate()+i);return`${d} ${dd.getDate()}`;});
  const rows=[[`Staff Roster — ${wl}`],[],['Name','Role','Type',...dhs,'Total Hours']];
  const ha=Object.keys(ALLOC).length>0;
  RORD.forEach(role=>{
    const rs=activeStaff().filter(s=>s.role===role);if(!rs.length)return;
    rows.push([role.toUpperCase()]);
    rs.forEach(s=>{
      const src=ha?(ALLOC[s.id]||s.prefs):s.prefs;
      const hrs=src.reduce((sum,p)=>sum+pH(p),0);
      rows.push([s.name,s.role,s.emp,...src.map(p=>{
        const base=!p||!p.type?'Off':p.type==='s'?'Starting (4:00am–12:30pm)':p.type==='c'?'Closing (12:00pm–9:30pm)':`Custom ${fmt12(p.s)}–${fmt12(p.e)}`;
        return p&&p.note?`${base} [${p.note}]`:base;
      }),`${hrs}h`]);
    });
    rows.push([]);
  });
  const ws=XLSX.utils.aoa_to_sheet(rows);ws['!cols']=[{wch:22},{wch:20},{wch:6},...Array(7).fill({wch:28}),{wch:12}];
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Roster');
  XLSX.writeFile(wb,`Roster_${wl.replace(/[\s–]/g,'_')}.xlsx`);
}

          <button class="btn sm ${SHOW_DL?'act':''}" id="dl-btn" onclick="tgDL()">⏱ Deadline</button>
          <button class="btn sm ${SHOW_NOTES?'act':''}" id="notes-btn" onclick="tgNotes()">📝 Notes</button>
          <button class="btn sm" onclick="copyLastWeek()" title="Copy last week's roster as this week's preferences">↩ Copy last week</button>
          <button class="btn sm btn-p" ${allSub()?'':'disabled'} onclick="calcShow()">Calculate</button>
        `:(MGR_TAB==='results'?`<button class="btn sm" onclick="MGR_TAB='prefs';render()">← Prefs</button>`:`<button class="btn sm" onclick="MGR_TAB='prefs';render()">← Prefs</button>`)}
        ${ha&&MGR_TAB==='results'?`<button class="btn sm" onclick="publishRoster()" title="Publish public link">📢 Publish</button>`:''}
        ${ha?`<button class="btn sm btn-g" onclick="exportExcel()">⬇ Excel</button><button class="btn sm" onclick="exportPDF()">⬇ PDF</button><button class="btn sm" onclick="copyText()">⧉ Copy</button>`:''}
        <button class="btn sm" onclick="window.print()">Print</button>
      </div>
    </div>
    ${!isSuper?`<div id="rq-wrap" style="display:none"><div class="card" style="margin-bottom:14px"><div style="font-size:13px;font-weight:600;margin-bottom:4px;color:var(--text)">Minimum staff per day</div><div style="font-size:12px;color:var(--text3);margin-bottom:12px">Minimum per role on any given day</div><div class="rgrid" id="rq-grid"></div></div></div>
    <div id="dl-wrap" style="display:none"><div class="card" style="margin-bottom:14px"><div style="font-size:13px;font-weight:600;margin-bottom:3px;color:var(--text)">Submission deadline</div><div style="font-size:12px;color:var(--text3);margin-bottom:12px">Staff cannot submit or edit after this point</div>
      <div style="display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap"><div><label class="lbl">Date and time</label><input type="datetime-local" id="dl-inp" value="${DEADLINE||''}" class="dl-inp" onchange="setDeadline(this.value)"></div>
      ${DEADLINE?`<button class="btn sm" onclick="clearDeadline()">Clear</button><span class="dl-bdg ${isPastDL()?'badge-red':'badge-amber'}">${isPastDL()?'⛔ Closed':timeUntilDL()||'Set'}</span>`:'<span style="font-size:12px;color:var(--text3)">No deadline set</span>'}
    </div></div></div>`:''}
    <div id="notes-wrap" style="display:none"><div class="notes-panel"><div class="notes-panel-title">Availability Notes</div><div class="notes-panel-sub">Notes added by staff alongside their shift preferences this week</div><div id="notes-panel-inner"><div class="no-notes">Loading…</div></div></div></div>
    ${MGR_TAB==='prefs'?`${cuEdHTML()}${noteEdHTML()}<div id="mgr-prefs"></div><div id="mgr-archive"></div>`:''}
    ${MGR_TAB==='results'?`${cuEdHTML()}<div id="mgr-results"></div>`:''}
    <div class="legend"><div class="legi"><div class="legd" style="background:#D97706"></div>Starting 4:00am–12:30pm</div><div class="legi"><div class="legd" style="background:#2563EB"></div>Closing 12:30pm–9:30pm</div><div class="legi"><div class="legd" style="background:#7C3AED"></div>Custom</div><span class="badge badge-FT">FT</span><span class="badge badge-PT">PT</span></div>
  </div>`;
}

// ─── Public roster view ───────────────────────────────────────────────
function renderPublicView(){
  if(!PUB_ROSTER)return`<div style="text-align:center;padding:48px 20px;color:var(--text3)"><div style="font-size:36px;margin-bottom:12px">📋</div><div style="font-size:16px;font-weight:500;color:var(--text);margin-bottom:8px">No roster published yet</div><div style="font-size:13px">The manager hasn't published a roster for viewing yet.</div></div>`;
  const{wk,staff,alloc,publishedAt}=PUB_ROSTER;
  const published=new Date(publishedAt).toLocaleDateString('en-IE',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
  const roleGroups={};
  Object.values(staff||{}).forEach(s=>{if(!roleGroups[s.role])roleGroups[s.role]=[];roleGroups[s.role].push(s);});
  const shCfg={s:{bg:'var(--shift-s-bg)',tx:'var(--shift-s-text)'},c:{bg:'var(--shift-c-bg)',tx:'var(--shift-c-text)'},custom:{bg:'var(--shift-cu-bg)',tx:'var(--shift-cu-text)'}};
  let cards='';
  const tabs=DAYS.map((d,i)=>`<button class="dtab${i===RES_DAY?' act':''}" onclick="RES_DAY=${i};document.getElementById('pub-content').innerHTML=renderPubDay(${i})">${d}</button>`).join('');
  return`<div style="padding-top:14px">
    <div class="pub-hdr"><div><div class="pub-title">Staff Roster</div><div style="font-size:12px;opacity:.7">Week of ${wk}</div></div><div style="font-size:11px;opacity:.6">Published ${published}</div></div>
    <div style="font-size:12px;color:var(--text3);margin-bottom:12px;text-align:center">Read-only view · <a href="${window.location.href.split('?')[0]}" style="color:var(--blue-text)">Staff login →</a></div>
    <div class="dtabs">${tabs}</div>
    <div id="pub-content">${renderPubDay(RES_DAY)}</div>
  </div>`;
}
function renderPubDay(d){
  if(!PUB_ROSTER)return'';
  const{staff,alloc}=PUB_ROSTER;
  const shCfg={s:{dot:'#D97706',lbl:'Starting',time:'4:00am–12:30pm'},c:{dot:'#2563EB',lbl:'Closing',time:'12:30pm–9:30pm'},custom:{dot:'#7C3AED',lbl:'Custom',time:'custom hours'}};
  return ['s','c','custom'].map(sk=>{
    const sv=shCfg[sk];
    const ins=Object.values(staff||{}).filter(s=>{const p=(alloc[s.id]||[])[d];return p&&p.type===sk;});
    if(!ins.length)return'';
    const chips=ins.map(s=>`<div class="pub-chip"><div class="chav" style="background:var(--shift-${sk==='s'?'s':'c'}-bg);color:var(--shift-${sk==='s'?'s':'c'}-text)">${inits(s.name)}</div><div><div style="font-size:12px;font-weight:500;color:var(--text)">${s.name}</div><div style="font-size:10px;color:var(--text3)">${s.role} · ${s.emp}</div></div></div>`).join('');
    return`<div class="pub-card"><div style="display:flex;align-items:center;gap:7px;margin-bottom:8px"><div class="sdot" style="background:${sv.dot}"></div><span style="font-size:13px;font-weight:500;color:var(--text)">${sv.lbl}</span><span style="font-size:11px;color:var(--text3);font-family:monospace">${sv.time}</span><span style="margin-left:auto;font-size:11px;color:var(--text3)">${ins.length} staff</span></div><div class="pub-staff">${chips}</div></div>`;
  }).join('');
}

// ─── Main render ──────────────────────────────────────────────────────
function render(){
  const app=document.getElementById('app');
  switch(VIEW){
    case 'loading':app.innerHTML=`<div class="loading-wrap"><div class="spinner"></div><div class="loading-txt">Loading…</div></div>`;break;
    case 'landing':app.innerHTML=renderLanding();break;
    case 'auth':app.innerHTML=renderAuth();break;
    case 'emp-list':app.innerHTML=renderEmpList();break;
    case 'emp-pin-create':app.innerHTML=renderEmpPinCreate();break;
    case 'emp-pin-enter':app.innerHTML=renderEmpPinEnter();break;
    case 'emp-pin-forgot':app.innerHTML=renderEmpPinForgot();break;
    case 'emp-form':app.innerHTML=renderEmpForm();setTimeout(updCuH,0);break;
    case 'emp-done':app.innerHTML=renderEmpDone();break;
    case 'public':app.innerHTML=renderPublicView();break;
    case 'mgr':
      app.innerHTML=renderMgr();
      if(MGR_TAB==='prefs'){renderPrefs();if(SHOW_REQ)renderReqPanel();}
      else renderResults();
      setTimeout(updCuH,0);break;
  }
}

// ─── Init ─────────────────────────────────────────────────────────────
function withTimeout(p,ms){return Promise.race([p,new Promise((_,r)=>setTimeout(()=>r(new Error('timeout')),ms))]);}

async function init(){
  initDark();
  // Check for public view
  if(window.location.search.includes('public=1')){
    try{await initDB();}catch(e){USE_FIREBASE=false;}
    try{await withTimeout(loadAll(),6000);}catch(e){}
    if(USE_FIREBASE)setupListeners();
    VIEW='public';RES_DAY=0;render();return;
  }
  try{await initDB();}catch(e){USE_FIREBASE=false;}
  try{await withTimeout(loadAll(),6000);}catch(e){console.warn('Load error:',e);if(!STAFF.length)STAFF=[];if(!RORD.length)RORD=[...ROLES_DEF];}
  if(USE_FIREBASE)setupListeners();
  VIEW='landing';render();
}
init();
</script>
</body>
</html>
