<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FAFAF8">
<title>Shift Scheduler</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=Fraunces:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<!-- SheetJS for Excel export -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
/* ─── FIREBASE CONFIG NOTICE ─────────────────────────────────────── */
/* Search for "YOUR_API_KEY" below and replace the firebaseConfig     */
/* object with your own Firebase project credentials.                 */
/* See the deployment guide at the bottom of this file.               */
/* ──────────────────────────────────────────────────────────────────── */

:root {
  --bg: #FAFAF8;
  --bg2: #F3F2EE;
  --bg3: #ECEAE4;
  --border: #E2DFD8;
  --border2: #CCCAC3;
  --text: #1C1917;
  --text2: #57534E;
  --text3: #A8A29E;
  --accent: #E85D26;
  --accent-bg: #FEF3EE;
  --accent-text: #9A3412;
  --green: #16A34A;
  --green-bg: #F0FDF4;
  --green-text: #15803D;
  --amber: #D97706;
  --amber-bg: #FFFBEB;
  --amber-text: #92400E;
  --red: #DC2626;
  --red-bg: #FEF2F2;
  --red-text: #991B1B;
  --blue: #2563EB;
  --blue-bg: #EFF6FF;
  --blue-text: #1D4ED8;
  --shift-s-bg: #FEF9EE;
  --shift-s-text: #92400E;
  --shift-c-bg: #EFF6FF;
  --shift-c-text: #1D4ED8;
  --shift-cu-bg: #F5F3FF;
  --shift-cu-text: #4C1D95;
  --radius: 12px;
  --radius-sm: 8px;
  --radius-xs: 6px;
  --shadow: 0 1px 3px rgba(0,0,0,.07), 0 1px 2px rgba(0,0,0,.05);
  --shadow-md: 0 4px 12px rgba(0,0,0,.08), 0 2px 4px rgba(0,0,0,.05);
  --font: 'DM Sans', system-ui, sans-serif;
  --font-display: 'Fraunces', Georgia, serif;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { height: 100%; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
.sr-only { position: absolute; width: 1px; height: 1px; clip: rect(0,0,0,0); overflow: hidden; }

/* ─── SETUP BANNER ───────────────────────────────────────────────── */
#setup-banner {
  background: var(--amber-bg);
  border-bottom: 1px solid #FCD34D;
  padding: 10px 16px;
  font-size: 13px;
  color: var(--amber-text);
  display: flex;
  align-items: flex-start;
  gap: 8px;
  display: none;
}
#setup-banner.show { display: flex; }
#setup-banner strong { font-weight: 600; }

/* ─── WRAPPER ────────────────────────────────────────────────────── */
#app {
  max-width: 780px;
  margin: 0 auto;
  padding: 0 16px 80px;
}
@media (min-width: 640px) {
  #app { padding: 0 24px 60px; }
}

/* ─── BUTTONS ────────────────────────────────────────────────────── */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  height: 40px;
  padding: 0 16px;
  border: 1px solid var(--border2);
  border-radius: var(--radius-sm);
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  white-space: nowrap;
  transition: background .15s, border-color .15s;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
.btn:hover, .btn:active { background: var(--bg2); }
.btn:disabled { opacity: .38; pointer-events: none; }
.btn.sm { height: 32px; padding: 0 12px; font-size: 12px; }
.btn.xs { height: 26px; padding: 0 9px; font-size: 11px; }
.btn-primary {
  background: var(--text);
  color: var(--bg);
  border-color: var(--text);
}
.btn-primary:hover, .btn-primary:active { background: #292524; border-color: #292524; }
.btn-accent {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
}
.btn-accent:hover, .btn-accent:active { background: #D05220; }
.btn-green {
  background: var(--green);
  color: #fff;
  border-color: var(--green);
}
.btn.act { background: var(--bg3); border-color: var(--border2); }

/* ─── FORM ELEMENTS ──────────────────────────────────────────────── */
.inp {
  height: 44px;
  width: 100%;
  border: 1px solid var(--border2);
  border-radius: var(--radius-sm);
  padding: 0 14px;
  font-family: var(--font);
  font-size: 15px;
  color: var(--text);
  background: var(--bg);
  outline: none;
  transition: border-color .15s;
}
.inp:focus { border-color: var(--text); }
.inp.pin-inp {
  font-size: 26px;
  letter-spacing: 12px;
  text-align: center;
  font-family: monospace;
  height: 56px;
}
.lbl { font-size: 12px; font-weight: 500; color: var(--text2); margin-bottom: 6px; display: block; }
.field { margin-bottom: 14px; }
.err { font-size: 12px; color: var(--red-text); display: none; margin-top: 5px; }
.err.show { display: block; }

/* ─── CARDS ──────────────────────────────────────────────────────── */
.card {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 16px;
}
.card + .card { margin-top: 10px; }

/* ─── BADGES ─────────────────────────────────────────────────────── */
.badge {
  display: inline-flex;
  align-items: center;
  font-size: 11px;
  font-weight: 500;
  padding: 2px 7px;
  border-radius: 20px;
}
.badge-FT { background: #FEF9EE; color: #92400E; }
.badge-PT { background: var(--shift-cu-bg); color: var(--shift-cu-text); }
.badge-green { background: var(--green-bg); color: var(--green-text); }
.badge-amber { background: var(--amber-bg); color: var(--amber-text); }
.badge-red { background: var(--red-bg); color: var(--red-text); }
.badge-blue { background: var(--blue-bg); color: var(--blue-text); }

/* ─── SHIFT BADGES ───────────────────────────────────────────────── */
.shift-s { background: var(--shift-s-bg); color: var(--shift-s-text); }
.shift-c { background: var(--shift-c-bg); color: var(--shift-c-text); }
.shift-cu { background: var(--shift-cu-bg); color: var(--shift-cu-text); }
.shift-off { color: var(--text3); font-style: italic; }

/* ─── PROGRESS BAR ───────────────────────────────────────────────── */
.progress { margin-bottom: 16px; }
.progress-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
.progress-label { font-size: 13px; color: var(--text2); }
.progress-track { height: 3px; background: var(--bg3); border-radius: 2px; overflow: hidden; }
.progress-fill { height: 100%; background: var(--green); border-radius: 2px; transition: width .4s ease; }

/* ─── TOOLBAR ────────────────────────────────────────────────────── */
.toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  flex-wrap: wrap;
  padding: 14px 0 12px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 16px;
}
.toolbar-left, .toolbar-right { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.wk-nav { display: flex; align-items: center; gap: 4px; }
.wk-nav-btn {
  width: 30px; height: 30px;
  display: flex; align-items: center; justify-content: center;
  border: 1px solid var(--border2);
  border-radius: var(--radius-xs);
  background: var(--bg);
  cursor: pointer;
  font-size: 16px;
  color: var(--text2);
  -webkit-tap-highlight-color: transparent;
}
.wk-nav-btn:active { background: var(--bg2); }
.wk-label { font-size: 12px; font-weight: 500; color: var(--text2); padding: 0 4px; }

/* ─── LANDING PAGE ───────────────────────────────────────────────── */
.landing {
  padding: 48px 0 24px;
  text-align: center;
}
.landing-logo {
  font-family: var(--font-display);
  font-size: 32px;
  font-weight: 300;
  color: var(--text);
  margin-bottom: 6px;
  line-height: 1.2;
}
.landing-sub { font-size: 13px; color: var(--text3); margin-bottom: 36px; }
.landing-cards {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  max-width: 360px;
  margin: 0 auto 28px;
}
@media (max-width: 380px) { .landing-cards { grid-template-columns: 1fr; } }
.landing-card {
  padding: 24px 16px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--bg);
  cursor: pointer;
  transition: border-color .15s, box-shadow .15s;
  -webkit-tap-highlight-color: transparent;
}
.landing-card:hover, .landing-card:active {
  border-color: var(--text);
  box-shadow: var(--shadow-md);
}
.landing-card-icon { font-size: 26px; margin-bottom: 10px; }
.landing-card-title { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
.landing-card-desc { font-size: 12px; color: var(--text3); line-height: 1.4; }
.deadline-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  padding: 6px 14px;
  border-radius: 20px;
  margin-top: 4px;
}

/* ─── AUTH SCREENS ───────────────────────────────────────────────── */
.auth-wrap {
  max-width: 340px;
  margin: 40px auto 0;
  padding: 0 4px;
}
.auth-title { font-family: var(--font-display); font-size: 22px; font-weight: 300; text-align: center; margin-bottom: 6px; }
.auth-sub { font-size: 13px; color: var(--text2); text-align: center; margin-bottom: 24px; line-height: 1.5; }
.auth-avatar {
  width: 54px; height: 54px;
  border-radius: 50%;
  background: var(--bg3);
  display: flex; align-items: center; justify-content: center;
  font-weight: 600; font-size: 18px;
  margin: 0 auto 14px;
  color: var(--text2);
}

/* ─── EMPLOYEE LIST ──────────────────────────────────────────────── */
.emp-list { max-width: 460px; margin: 0 auto; }
.emp-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 16px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  margin-bottom: 8px;
  background: var(--bg);
  cursor: pointer;
  transition: border-color .15s;
  -webkit-tap-highlight-color: transparent;
}
.emp-item:not(.emp-done):hover, .emp-item:not(.emp-done):active { border-color: var(--text); }
.emp-done { opacity: .6; cursor: default; }
.emp-name { font-size: 14px; font-weight: 500; margin-bottom: 2px; }
.emp-role { font-size: 12px; color: var(--text3); }
.emp-arrow { font-size: 18px; color: var(--text3); }

/* ─── EMPLOYEE FORM ──────────────────────────────────────────────── */
.emp-header { margin-bottom: 18px; }
.emp-name-big { font-family: var(--font-display); font-size: 22px; font-weight: 300; }
.emp-role-small { font-size: 13px; color: var(--text2); margin-top: 3px; }
.dl-banner {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 14px;
  border-radius: var(--radius-sm);
  font-size: 13px;
  margin-bottom: 14px;
}
.dl-banner.amber { background: var(--amber-bg); color: var(--amber-text); border: 1px solid #FCD34D; }
.dl-banner.red { background: var(--red-bg); color: var(--red-text); border: 1px solid #FECACA; }

/* ─── SHIFT GRID ─────────────────────────────────────────────────── */
.grid-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; margin-bottom: 16px; }
.shift-grid {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
}
.shift-grid th {
  text-align: center;
  padding: 7px 4px;
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .06em;
  color: var(--text3);
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
.shift-grid th.nc { text-align: left; padding-left: 12px; min-width: 120px; }
.shift-grid th.today-h { background: #EEF5FF; color: #1D4ED8; }
.shift-grid td {
  padding: 3px;
  border-bottom: 1px solid var(--border);
  vertical-align: middle;
}
.shift-grid td.nc { padding: 6px 4px 6px 12px; }
.shift-grid tr:last-child td { border-bottom: none; }
.today-col { background: rgba(37,99,235,.05) !important; }
.shift-select {
  width: 100%;
  height: 30px;
  border: 1px solid var(--border);
  border-radius: var(--radius-xs);
  background: var(--bg2);
  font-size: 10px;
  font-family: var(--font);
  color: var(--text3);
  cursor: pointer;
  padding: 0 2px;
  outline: none;
  min-width: 72px;
}
.shift-select.s { background: var(--shift-s-bg); color: var(--shift-s-text); border-color: transparent; }
.shift-select.c { background: var(--shift-c-bg); color: var(--shift-c-text); border-color: transparent; }
.shift-select.cu { background: var(--shift-cu-bg); color: var(--shift-cu-text); border-color: transparent; }
.hours-cell { text-align: center; font-size: 12px; font-weight: 500; color: var(--text2); min-width: 38px; }
.hours-zero { color: var(--text3); font-weight: 400; }
.shift-span { display: block; text-align: center; padding: 3px 4px; border-radius: 4px; font-size: 10px; white-space: nowrap; }
.edit-cu-btn {
  width: 20px; height: 20px;
  border: 1px solid var(--border2);
  border-radius: 4px;
  background: transparent;
  cursor: pointer;
  font-size: 11px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  font-family: var(--font);
  color: var(--text2);
}
.cell-wrap { display: flex; align-items: center; gap: 2px; }

/* ─── STAFF ROW HEADER ───────────────────────────────────────────── */
.staff-name-wrap { display: flex; align-items: center; gap: 6px; margin-bottom: 2px; }
.staff-nm {
  font-size: 13px; font-weight: 500;
  cursor: pointer;
  border-bottom: 1px dashed transparent;
  max-width: 80px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  display: inline-block;
}
.staff-nm:hover { border-bottom-color: var(--border2); }
.staff-nm-inp {
  width: 100%;
  height: 26px;
  border: 1px solid var(--border2);
  border-radius: 4px;
  padding: 0 6px;
  font-size: 12px;
  font-family: var(--font);
  outline: none;
  background: var(--bg);
  color: var(--text);
  display: none;
}
.staff-subrole { font-size: 10px; color: var(--text3); }
.status-ok { font-size: 10px; background: var(--green-bg); color: var(--green-text); padding: 2px 7px; border-radius: 20px; white-space: nowrap; display: inline-block; }

/* ─── ROLE SECTION ───────────────────────────────────────────────── */
.role-sec { margin-bottom: 20px; border-radius: var(--radius); border: 1px solid transparent; transition: border-color .15s; }
.role-sec.drag-over { border-color: var(--blue); background: rgba(37,99,235,.03); }
.role-sec.dragging { opacity: .4; }
.role-hdr {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 12px;
  background: var(--bg2);
  border-radius: var(--radius-sm);
  margin-bottom: 6px;
  user-select: none;
}
.role-hdr-left { display: flex; align-items: center; gap: 8px; }
.drag-handle { display: flex; flex-direction: column; gap: 2.5px; cursor: grab; padding: 2px 4px; opacity: .4; }
.drag-handle:hover { opacity: .8; }
.drag-handle:active { cursor: grabbing; }
.dh-line { width: 13px; height: 1.5px; background: var(--text2); border-radius: 1px; }
.role-name { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--text2); }
.role-count { font-size: 11px; color: var(--text3); }
.role-min-badge { font-size: 10px; padding: 1px 6px; border-radius: 10px; background: var(--bg3); border: 1px solid var(--border); color: var(--text3); }
.role-hdr-right { display: flex; align-items: center; gap: 4px; }
.ord-btn {
  width: 24px; height: 24px;
  border: 1px solid var(--border2);
  border-radius: 4px;
  background: transparent;
  cursor: pointer;
  font-size: 12px;
  color: var(--text2);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font);
}
.ord-btn:hover { background: var(--bg); }
.ord-btn:disabled { opacity: .2; pointer-events: none; }
.empty-row td { text-align: center; padding: 14px; color: var(--text3); font-size: 12px; font-style: italic; }
.add-row td { padding: 4px 3px; }
.add-inp-cell {
  width: 100%;
  height: 28px;
  border: 1px solid var(--border2);
  border-radius: 5px;
  padding: 0 9px;
  font-size: 12px;
  font-family: var(--font);
  outline: none;
  background: var(--bg);
  color: var(--text);
}

/* ─── CUSTOM SHIFT EDITOR ────────────────────────────────────────── */
.cu-editor {
  background: var(--bg2);
  border: 1px solid var(--border2);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 16px;
}
.cu-editor-title { font-size: 14px; font-weight: 500; margin-bottom: 12px; }
.cu-editor-row { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
.cu-field { flex: 1; min-width: 120px; }
.time-inp {
  height: 38px;
  width: 100%;
  border: 1px solid var(--border2);
  border-radius: var(--radius-xs);
  padding: 0 10px;
  font-size: 14px;
  font-family: var(--font);
  outline: none;
  background: var(--bg);
  color: var(--text);
}
.time-inp:focus { border-color: var(--text); }
.cu-hrs { font-size: 12px; color: var(--text2); padding-bottom: 5px; }
.cu-actions { display: flex; gap: 8px; align-items: flex-end; flex-wrap: wrap; margin-top: 10px; }

/* ─── COPY CUSTOM PANEL ──────────────────────────────────────────── */
.copy-panel {
  background: var(--bg2);
  border: 1px solid var(--border2);
  border-radius: var(--radius);
  padding: 14px 16px;
  margin-bottom: 16px;
}
.copy-panel-title { font-size: 14px; font-weight: 500; margin-bottom: 6px; }
.copy-panel-sub { font-size: 12px; color: var(--text2); margin-bottom: 10px; }
.day-checks { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.day-check-lbl {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 13px;
  padding: 6px 10px;
  border: 1px solid var(--border2);
  border-radius: var(--radius-xs);
  cursor: pointer;
  background: var(--bg);
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.day-check-lbl input { accent-color: var(--accent); width: 14px; height: 14px; }
.day-check-lbl.has-pref { opacity: .6; }
.copy-actions { display: flex; gap: 8px; }

/* ─── DONE SCREEN ────────────────────────────────────────────────── */
.done-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  padding: 52px 20px;
  gap: 10px;
}
.done-icon { font-size: 44px; margin-bottom: 4px; }
.done-title { font-family: var(--font-display); font-size: 22px; font-weight: 300; }
.done-sub { font-size: 14px; color: var(--text2); }
.done-meta { font-size: 12px; color: var(--text3); }
.done-actions { display: flex; flex-direction: column; gap: 8px; width: 100%; max-width: 260px; margin-top: 8px; }

/* ─── MANAGER – RESULTS ──────────────────────────────────────────── */
.day-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; overflow-x: auto; padding-bottom: 4px; }
.day-tab {
  height: 34px;
  padding: 0 13px;
  border: 1px solid var(--border2);
  border-radius: var(--radius-sm);
  background: var(--bg);
  cursor: pointer;
  font-size: 12px;
  font-weight: 500;
  color: var(--text2);
  font-family: var(--font);
  white-space: nowrap;
  flex-shrink: 0;
  -webkit-tap-highlight-color: transparent;
}
.day-tab.act { background: var(--text); color: var(--bg); border-color: var(--text); }
.day-tab.warn { border-color: var(--amber); color: var(--amber-text); }
.day-tab.act.warn { background: var(--amber-bg); border-color: var(--amber); color: var(--amber-text); }

.res-card {
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px;
  margin-bottom: 10px;
  background: var(--bg);
}
.res-card-header { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
.shift-dot { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
.res-card-title { font-size: 14px; font-weight: 500; }
.res-card-time { font-size: 11px; color: var(--text2); font-family: monospace; }
.res-card-count { margin-left: auto; font-size: 11px; color: var(--text3); }

.staff-chip {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 6px 10px;
  border: 1px solid var(--border);

<div id="app">
  <div class="loading-wrap">
    <div class="spinner"></div>
    <div class="loading-txt">Loading…</div>
  </div>
</div>

<div id="sticky-bar-slot"></div>

<script>
// ═══════════════════════════════════════════════════════════════════════
//  FIREBASE REALTIME DATABASE — REST API (no SDK required)
//  Uses plain fetch() calls — no external scripts needed.
//  To change project: update DB_URL below.
// ═══════════════════════════════════════════════════════════════════════
const DB_URL = 'https://the-roster-87c07-default-rtdb.europe-west1.firebasedatabase.app/roster_app';
// ═══════════════════════════════════════════════════════════════════════

const MANAGER_PIN = '1234'; // Change this to your preferred manager PIN
const ROLES_DEF = ['Manager','Assistant Manager','Floor Staff','Kitchen Porter','Bar Staff','Receptionist'];
const DAYS = ['Thu','Fri','Sat','Sun','Mon','Tue','Wed'];
const SEN = {Manager:1,'Assistant Manager':2,'Floor Staff':3,'Kitchen Porter':4,'Bar Staff':5,Receptionist:6};

// ─── Database: REST API + localStorage fallback ───────────────────────
let USE_FIREBASE = false;
let pollTimer = null;

async function initDB() {
  // Quick connectivity test — try a GET on the root
  try {
    const ctrl = new AbortController();
    const tid = setTimeout(() => ctrl.abort(), 5000);
    const r = await fetch(`${DB_URL}.json`, { signal: ctrl.signal });
    clearTimeout(tid);
    if (r.ok) { USE_FIREBASE = true; return; }
  } catch(e) {}
  // Fallback to localStorage
  console.info('Firebase unreachable — running in local mode.');
  document.getElementById('setup-banner').classList.add('show');
}

async function dbGet(path) {
  if (USE_FIREBASE) {
    try {
      const ctrl = new AbortController();
      const tid = setTimeout(() => ctrl.abort(), 6000);
      const r = await fetch(`${DB_URL}/${path}.json`, { signal: ctrl.signal });
      clearTimeout(tid);
      if (!r.ok) return null;
      const data = await r.json();
      return data === null || data === undefined ? null : data;
    } catch(e) { console.warn('dbGet failed:', path, e); return null; }
  } else {
    return getNested(getLocalStore(), path.split('/'));
  }
}

async function dbSet(path, value) {
  if (USE_FIREBASE) {
    try {
      showSync('syncing');
      const ctrl = new AbortController();
      const tid = setTimeout(() => ctrl.abort(), 6000);
      await fetch(`${DB_URL}/${path}.json`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(value),
        signal: ctrl.signal
      });
      clearTimeout(tid);
      showSync('saved');
    } catch(e) { console.warn('dbSet failed:', path, e); showSync(''); }
  } else {
    const store = getLocalStore();
    setNested(store, path.split('/'), value);
    localStorage.setItem('roster_app', JSON.stringify(store));
  }
}

async function dbRemove(path) {
  if (USE_FIREBASE) {
    try {
      await fetch(`${DB_URL}/${path}.json`, { method: 'DELETE' });
    } catch(e) { console.warn('dbRemove failed:', path, e); }
  } else {
    const store = getLocalStore();
    removeNested(store, path.split('/'));
    localStorage.setItem('roster_app', JSON.stringify(store));
  }
}

// Poll every 5 seconds so all devices stay in sync
function startPolling() {
  if (!USE_FIREBASE) return;
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(async () => {
    if (VIEW === 'loading') return;
    const snap = await dbGet('');
    if (snap) applySnapshot(snap);
  }, 5000);
}

function applySnapshot(snap) {
  if (!snap) return;
  let changed = false;
  if (snap.staff) { const ns = Object.values(snap.staff).filter(Boolean); if (JSON.stringify(ns) !== JSON.stringify(STAFF)) { STAFF = ns; changed = true; } }
  if (snap.nextId) NEXT_ID = snap.nextId;
  if (snap.rord && JSON.stringify(snap.rord) !== JSON.stringify(RORD)) { RORD = snap.rord; changed = true; }
  if (snap.mins) { MINS = { ...{ Manager:1,'Assistant Manager':2,'Floor Staff':4,'Kitchen Porter':2,'Bar Staff':1,Receptionist:2 }, ...snap.mins }; changed = true; }
  if (snap.deadline !== undefined) DEADLINE = snap.deadline || null;
  if (snap.alloc) ALLOC = snap.alloc;
  if (snap.ovr) OVR = snap.ovr;
  if (snap.pins) { Object.keys(snap.pins).forEach(id => { hasPINcache[id] = true; }); }
  if (changed && VIEW !== 'loading') render();
}

function getLocalStore() {
  try { return JSON.parse(localStorage.getItem('roster_app') || '{}'); } catch { return {}; }
}
function getNested(obj, keys) {
  return keys.reduce((o, k) => (o && o[k] !== undefined ? o[k] : null), obj);
}
function setNested(obj, keys, value) {
  const ks = [...keys]; const last = ks.pop();
  const parent = ks.reduce((o, k) => { if (!o[k] || typeof o[k] !== 'object') o[k] = {}; return o[k]; }, obj);
  parent[last] = value;
}
function removeNested(obj, keys) {
  const ks = [...keys]; const last = ks.pop();
  const parent = ks.reduce((o, k) => (o && o[k] ? o[k] : {}), obj);
  if (parent) delete parent[last];
}

let syncTimer = null;
function showSync(state) {
  const el = document.getElementById('sync-status');
  if (!el) return;
  el.className = 'sync-status ' + state;
  el.textContent = state === 'syncing' ? '⟳ Syncing…' : state === 'saved' ? '✓ Saved' : '';
  clearTimeout(syncTimer);
  if (state === 'saved') syncTimer = setTimeout(() => { if(el) el.className = 'sync-status'; }, 2000);
}

// ─── PIN hashing (SHA-256 via Web Crypto) ─────────────────────────────
async function hashPIN(pin) {
  const enc = new TextEncoder().encode(pin + '_roster_salt');
  const hash = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2,'0')).join('');
}
async function savePin(staffId, pin) {
  const h = await hashPIN(pin);
  await dbSet('pins/' + staffId, h);
}
async function hasPin(staffId) {
  const h = await dbGet('pins/' + staffId);
  return !!h;
}
async function checkPin(staffId, pin) {
  const stored = await dbGet('pins/' + staffId);
  if (!stored) return false;
  const h = await hashPIN(pin);
  return h === stored;
}

// ─── App State ────────────────────────────────────────────────────────
let VIEW = 'loading';
let EMP_ID = null;
let WK_OFF = 0;
let MGR_TAB = 'prefs';
let RES_DAY = 0;
let SHOW_REQ = false;
let SHOW_DL = false;
let SHOW_DIFF = false;
let ADD_RI = null;
let DSRC = null;
let CU_EDITOR = null;
let COPY_PENDING = null;
let ALLOC = {};
let OVR = {};
let DIFF = [];

let STAFF = [];
let RORD = [...ROLES_DEF];
let MINS = {Manager:1,'Assistant Manager':2,'Floor Staff':4,'Kitchen Porter':2,'Bar Staff':1,Receptionist:2};
let DEADLINE = null;
let NEXT_ID = 4;

// ─── Date Helpers ─────────────────────────────────────────────────────
function getWeekStart(off) {
  const d = new Date(), day = d.getDay();
  d.setDate(d.getDate() - (day+3)%7 + off*7);
  d.setHours(0,0,0,0); return d;
}
function fmtDate(d) { return d.toLocaleDateString('en-IE',{day:'numeric',month:'short'}); }
function fmtDateTime(d) { return d.toLocaleDateString('en-IE',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}); }
function todayCol() {
  const t = new Date(); t.setHours(0,0,0,0);
  const th = getWeekStart(WK_OFF);
  for(let i=0;i<7;i++){const d=new Date(th);d.setDate(th.getDate()+i);if(d.getTime()===t.getTime())return i;}
  return -1;
}
function wkHeader() { const th=getWeekStart(WK_OFF),e=new Date(th);e.setDate(th.getDate()+6);return`${fmtDate(th)} – ${fmtDate(e)}`; }
function isPastDL() { return DEADLINE ? new Date() > new Date(DEADLINE) : false; }
function dlLabel() { return DEADLINE ? fmtDateTime(new Date(DEADLINE)) : null; }
function timeUntilDL() {
  if(!DEADLINE)return null;
  const diff = new Date(DEADLINE) - new Date();
  if(diff<=0)return null;
  const h=Math.floor(diff/3600000), m=Math.floor((diff%3600000)/60000);
  if(h>48)return`${Math.floor(h/24)} days remaining`;
  if(h>0)return`${h}h ${m}m remaining`;
  return`${m}m remaining`;
}

// ─── Shift Helpers ────────────────────────────────────────────────────
function mkP() { return Array(7).fill(null).map(()=>({type:'',s:'',e:''})); }
function pHours(p) {
  if(!p||!p.type)return 0;
  if(p.type==='s')return 8.5;
  if(p.type==='c')return 9;
  if(p.type==='custom'&&p.s&&p.e){
    const[sh,sm]=p.s.split(':').map(Number),[eh,em]=p.e.split(':').map(Number);
    let m=(eh*60+em)-(sh*60+sm); if(m<=0)m+=1440;
    return Math.round(m*10/60)/10;
  }
  return 0;
}
function totalHours(s, src) {
  const pr = src==='a' ? (ALLOC[s.id] || s.prefs) : s.prefs;
  return pr.reduce((sum,p)=>sum+pHours(p),0);
}
function shiftLabel(p) {
  if(!p||!p.type)return 'Off';
  if(p.type==='s')return 'Starting';
  if(p.type==='c')return 'Closing';
  if(p.type==='custom'&&p.s)return fmt12(p.s)+'–'+fmt12(p.e);
  return 'Off';
}
function shiftCls(p) {
  if(!p||!p.type)return '';
  return p.type==='s'?'s':p.type==='c'?'c':p.type==='custom'?'cu':'';
}
function fmt12(t) {
  if(!t)return '';
  const[h,m]=t.split(':').map(Number);
  const ap=h<12?'am':'pm', hh=h%12||12;
  return m===0?`${hh}${ap}`:`${hh}:${String(m).padStart(2,'0')}${ap}`;
}
function fmtH(h) { return h===0?'—':h===Math.floor(h)?h+'h':h.toFixed(1)+'h'; }
function initials(n) { return (n||'').split(' ').filter(Boolean).map(p=>p[0]).join('').slice(0,2).toUpperCase()||'?'; }
function subCount() { return STAFF.filter(s=>s.sub).length; }
function allSubmitted() { return STAFF.length>0&&STAFF.every(s=>s.sub); }

// ─── Data Persistence ─────────────────────────────────────────────────
async function loadAll() {
  if (USE_FIREBASE) {
    const snap = await dbGet('');
    if (snap) applySnapshot(snap);
    return;
  }
  // localStorage fallback
  const data = getLocalStore();
  if (data.staff) { STAFF = Object.values(data.staff).filter(Boolean); NEXT_ID = data.nextId || (STAFF.length ? Math.max(...STAFF.map(s=>s.id))+1 : 4); }
  if (data.rord) RORD = data.rord;
  if (data.mins) MINS = {...MINS, ...data.mins};
  if (data.deadline) DEADLINE = data.deadline;
  if (data.alloc) ALLOC = data.alloc;
  if (data.ovr) OVR = data.ovr;
  if (data.pins) Object.keys(data.pins).forEach(id => { hasPINcache[id] = true; });
}

function setupListeners() {
  // REST-based: polling is handled by startPolling()
  startPolling();
}

async function saveStaff() {
  const obj = {};
  STAFF.forEach(s => { obj[s.id] = s; });
  await dbSet('staff', obj);
  await dbSet('nextId', NEXT_ID);
}
async function saveSettings() {
  await dbSet('rord', RORD);
  await dbSet('mins', MINS);
  if (DEADLINE) await dbSet('deadline', DEADLINE);
  else await dbRemove('deadline');
}
async function saveAlloc() {
  await dbSet('alloc', ALLOC);
  await dbSet('ovr', OVR);
}

// ─── Shift Setters ─────────────────────────────────────────────────────
async function setPref(id, di, val) {
  const s = STAFF.find(x=>x.id===id); if(!s||s.sub) return;
  if (val==='custom') {
    CU_EDITOR = {staffId:id, dayIdx:di, isA:false, prevP:{...s.prefs[di]}};
    s.prefs[di] = {type:'custom', s:'09:00', e:'17:00'};
    render(); return;
  }
  s.prefs[di] = val==='s'?{type:'s',s:'04:00',e:'12:30'}:val==='c'?{type:'c',s:'12:30',e:'21:30'}:{type:'',s:'',e:''};
  await saveStaff(); render();
}
async function setAlloc(id, di, val) {
  const s = STAFF.find(x=>x.id===id); if(!s) return;
  if(!ALLOC[id]) ALLOC[id] = s.prefs.map(p=>({...p}));
  if (val==='custom') {
    CU_EDITOR = {staffId:id, dayIdx:di, isA:true, prevP:{...(ALLOC[id][di]||{type:'',s:'',e:''})}};
    ALLOC[id][di] = {type:'custom', s:'09:00', e:'17:00'};
    if(!OVR[id]) OVR[id] = Array(7).fill(false); OVR[id][di] = true;
    render(); return;
  }
  ALLOC[id][di] = val==='s'?{type:'s',s:'04:00',e:'12:30'}:val==='c'?{type:'c',s:'12:30',e:'21:30'}:{type:'',s:'',e:''};
  if(!OVR[id]) OVR[id] = Array(7).fill(false); OVR[id][di] = true;
  await saveAlloc(); render();
}
function openCuEditor(id, di, isA) {
  const s = STAFF.find(x=>x.id===id); if(!s) return;
  const pr = isA ? (ALLOC[id]||s.prefs) : s.prefs;
  const p = pr[di] || {type:'',s:'',e:''};
  CU_EDITOR = {staffId:id, dayIdx:di, isA, prevP:{...p}};
  if(isA){ if(!ALLOC[id])ALLOC[id]=s.prefs.map(q=>({...q})); ALLOC[id][di]={type:'custom',s:p.s||'09:00',e:p.e||'17:00'}; }
  else s.prefs[di]={type:'custom',s:p.s||'09:00',e:p.e||'17:00'};
  render();
}
async function confirmCu() {
  if(!CU_EDITOR) return;
  const si=document.getElementById('cu-s'), ei=document.getElementById('cu-e');
  if(!si||!ei) return;
  const sv=si.value, ev=ei.value; if(!sv||!ev) return;
  const s=STAFF.find(x=>x.id===CU_EDITOR.staffId); if(!s) return;
  const np={type:'custom',s:sv,e:ev};
  if(CU_EDITOR.isA){ if(!ALLOC[s.id])ALLOC[s.id]=s.prefs.map(p=>({...p})); ALLOC[s.id][CU_EDITOR.dayIdx]=np; if(!OVR[s.id])OVR[s.id]=Array(7).fill(false); OVR[s.id][CU_EDITOR.dayIdx]=true; await saveAlloc(); }
  else { s.prefs[CU_EDITOR.dayIdx]=np; COPY_PENDING={staffId:CU_EDITOR.staffId,dayIdx:CU_EDITOR.dayIdx,pref:{...np}}; await saveStaff(); }
  CU_EDITOR=null; render();
}
function cancelCu() {
  if(!CU_EDITOR) return;
  const s=STAFF.find(x=>x.id===CU_EDITOR.staffId);
  if(s){ if(CU_EDITOR.isA){ if(ALLOC[s.id])ALLOC[s.id][CU_EDITOR.dayIdx]={...CU_EDITOR.prevP}; } else s.prefs[CU_EDITOR.dayIdx]={...CU_EDITOR.prevP}; }
  CU_EDITOR=null; render();
}
function updateCuHours() {
  const si=document.getElementById('cu-s'), ei=document.getElementById('cu-e'), hi=document.getElementById('cu-h');
  if(!si||!ei||!hi) return;
  if(!si.value||!ei.value){hi.textContent='';return;}
  const[sh,sm]=si.value.split(':').map(Number),[eh,em]=ei.value.split(':').map(Number);
  let mins=(eh*60+em)-(sh*60+sm); if(mins<=0)mins+=1440;
  hi.textContent=`= ${fmtH(Math.round(mins*10/60)/10)}`;
}
async function applyCopy() {
  if(!COPY_PENDING) return;

// ─── Allocation Engine ────────────────────────────────────────────────
function calculateAlloc() {
  ALLOC={}; OVR={}; DIFF=[];
  STAFF.forEach(s=>{ ALLOC[s.id]=s.prefs.map(p=>({...p})); });
  for(let d=0;d<7;d++){
    ROLES_DEF.forEach(r=>{
      const mn=MINS[r]||0; if(!mn) return;
      const rs=STAFF.filter(s=>s.role===r);
      const wk=rs.filter(s=>ALLOC[s.id][d]&&ALLOC[s.id][d].type);
      const nd=mn-wk.length; if(nd<=0) return;
      rs.filter(s=>!ALLOC[s.id][d]||!ALLOC[s.id][d].type).slice(0,nd).forEach(s=>{
        const wp=s.prefs.filter(p=>p&&p.type);
        const mc=wp.length>0?{...wp.sort((a,b)=>wp.filter(v=>v.type===b.type).length-wp.filter(v=>v.type===a.type).length)[0]}:{type:'c',s:'12:30',e:'21:30'};
        ALLOC[s.id][d]={...mc};
        DIFF.push({id:s.id,name:s.name,role:s.role,day:d,was:{type:'',s:'',e:''},now:{...mc},reason:'fi'});
      });
    });
    const ac=STAFF.filter(s=>ALLOC[s.id][d]&&ALLOC[s.id][d].type);
    if(ac.length<2) continue;
    const getGrps=()=>{const b={s:[],c:[],custom:[]};ac.forEach(s=>{const t=ALLOC[s.id][d].type;if(b[t])b[t].push(s);});return b;};
    let g=getGrps();
    if(g.s.length===0){const pool=[...g.c,...g.custom].filter(x=>x.role!=='Manager').sort((a,b)=>SEN[b.role]-SEN[a.role]);if(pool.length>0){const prev={...ALLOC[pool[0].id][d]},np={type:'s',s:'04:00',e:'12:30'};ALLOC[pool[0].id][d]=np;const op=pool[0].prefs[d];if(op&&op.type&&op.type!=='s')DIFF.push({id:pool[0].id,name:pool[0].name,role:pool[0].role,day:d,was:prev,now:np,reason:'adj'});}}
    g=getGrps();
    if(g.c.length+g.custom.length===0){const pool=[...g.s].filter(x=>x.role!=='Manager').sort((a,b)=>SEN[b.role]-SEN[a.role]);if(pool.length>0){const prev={...ALLOC[pool[0].id][d]},np={type:'c',s:'12:30',e:'21:30'};ALLOC[pool[0].id][d]=np;const op=pool[0].prefs[d];if(op&&op.type&&op.type!=='c')DIFF.push({id:pool[0].id,name:pool[0].name,role:pool[0].role,day:d,was:prev,now:np,reason:'adj'});}}
  }
}
async function calcAndShow() { if(!allSubmitted()) return; calculateAlloc(); await saveAlloc(); MGR_TAB='results'; RES_DAY=0; SHOW_DIFF=false; render(); }
function dayHasIssue(d) { return ROLES_DEF.some(r=>{const mn=MINS[r]||0;if(!mn)return false;return STAFF.filter(s=>s.role===r&&(ALLOC[s.id]||[])[d]&&(ALLOC[s.id]||[])[d].type).length<mn;}); }

// ─── Drag & Drop ──────────────────────────────────────────────────────
function setupDrag() {
  document.querySelectorAll('.role-sec[data-ri]').forEach(sec=>{
    const h=sec.querySelector('.drag-handle');
    if(h){h.addEventListener('mousedown',()=>sec.setAttribute('draggable','true'));h.addEventListener('mouseup',()=>sec.setAttribute('draggable','false'));}
    sec.addEventListener('dragstart',e=>{DSRC=parseInt(sec.dataset.ri);e.dataTransfer.effectAllowed='move';setTimeout(()=>sec.classList.add('dragging'),0);});
    sec.addEventListener('dragend',()=>{sec.classList.remove('dragging');sec.setAttribute('draggable','false');document.querySelectorAll('.role-sec').forEach(s=>s.classList.remove('drag-over'));DSRC=null;});
    sec.addEventListener('dragover',e=>{e.preventDefault();document.querySelectorAll('.role-sec').forEach(s=>s.classList.remove('drag-over'));sec.classList.add('drag-over');});
    sec.addEventListener('dragleave',e=>{if(!sec.contains(e.relatedTarget))sec.classList.remove('drag-over');});
    sec.addEventListener('drop',e=>{e.preventDefault();sec.classList.remove('drag-over');const t=parseInt(sec.dataset.ri);if(DSRC!==null&&DSRC!==t){const m=RORD.splice(DSRC,1)[0];RORD.splice(t,0,m);saveSettings();render();}});
  });
}

// ─── Export ───────────────────────────────────────────────────────────
function exportExcel() {
  if(typeof XLSX==='undefined'){alert('Excel library not loaded yet.');return;}
  const th=getWeekStart(WK_OFF),e=new Date(th);e.setDate(th.getDate()+6);
  const wl=`${fmtDate(th)} – ${fmtDate(e)}`;
  const dhs=DAYS.map((d,i)=>{const dd=new Date(th);dd.setDate(th.getDate()+i);return`${d} ${dd.getDate()}`;});
  const rows=[[`Staff Roster — ${wl}`],[],['Name','Role','Type',...dhs,'Total Hours']];
  const ha=Object.keys(ALLOC).length>0;
  RORD.forEach(role=>{
    const rs=STAFF.filter(s=>s.role===role);if(!rs.length)return;
    rows.push([role.toUpperCase()]);
    rs.forEach(s=>{const src=ha?(ALLOC[s.id]||s.prefs):s.prefs;rows.push([s.name,s.role,s.emp,...src.map(p=>{if(!p||!p.type)return'Off';if(p.type==='s')return'Starting (4:00am–12:30pm)';if(p.type==='c')return'Closing (12:30pm–9:30pm)';return`Custom ${fmt12(p.s)}–${fmt12(p.e)}`;}),''+src.reduce((sum,p)=>sum+pHours(p),0)+'h']);});
    rows.push([]);
  });
  const ws=XLSX.utils.aoa_to_sheet(rows);ws['!cols']=[{wch:22},{wch:20},{wch:6},...Array(7).fill({wch:26}),{wch:10}];
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Roster');
  XLSX.writeFile(wb,`Roster_${wl.replace(/[\s–]/g,'_')}.xlsx`);
}
function copyText() {
  const th=getWeekStart(WK_OFF),e=new Date(th);e.setDate(th.getDate()+6);
  let t=`STAFF ROSTER — ${fmtDate(th)} to ${fmtDate(e)}\n${'─'.repeat(46)}\n`;
  const ha=Object.keys(ALLOC).length>0;
  RORD.forEach(r=>{const rs=STAFF.filter(s=>s.role===r);if(!rs.length)return;t+=`\n${r.toUpperCase()}\n`;rs.forEach(s=>{const src=ha?(ALLOC[s.id]||s.prefs):s.prefs;t+=`  ${s.name} (${s.emp}) — ${fmtH(src.reduce((sum,p)=>sum+pHours(p),0))}\n`;DAYS.forEach((d,i)=>{t+=`    ${d}: ${shiftLabel(src[i])}\n`;});});});
  navigator.clipboard.writeText(t).then(()=>alert('Copied to clipboard!')).catch(()=>alert('Copy failed — use Excel download.'));
}

  </div>`;
}
async function verifyEmpPIN() {
  const v=document.getElementById('emp-pin');if(!v)return;
  const ok=await checkPin(EMP_ID, v.value);
  if(ok){const s=STAFF.find(x=>x.id===EMP_ID);VIEW=(s&&s.sub)?'emp-done':'emp-form';render();}
  else{const e=document.getElementById('perr-wrong');if(e)e.classList.add('show');}
}

function renderEmpForm() {
  const s=STAFF.find(x=>x.id===EMP_ID);if(!s)return renderEmpList();
  const past=isPastDL();
  if(past&&!s.sub)return`<div style="padding-top:14px"><button class="btn sm" onclick="VIEW='emp-list';render()">← Back</button><div class="dl-banner red" style="margin-top:14px">⛔ Submissions are closed — the deadline (${dlLabel()}) has passed. Contact your manager.</div></div>`;
  const tc=todayCol(),th=getWeekStart(WK_OFF),e=new Date(th);e.setDate(th.getDate()+6);
  const hrs=totalHours(s,'p');
  return`<div>
    <div style="padding-top:14px;margin-bottom:14px"><button class="btn sm" onclick="VIEW='emp-list';render()">← Back</button></div>
    ${dlBannerHTML()}
    ${cuEditorHTML()}
    ${copyPanelHTML()}
    <div class="emp-header">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:8px">
        <div>
          <div class="emp-name-big">${s.name}</div>
          <div class="emp-role-small">${s.role} · <span class="badge badge-${s.emp}">${s.emp}</span></div>
        </div>
        <div style="display:flex;align-items:center;gap:4px">
          <button class="wk-nav-btn" onclick="WK_OFF--;render()">‹</button>
          <span class="wk-label">${fmtDate(th)} – ${fmtDate(e)}</span>
          <button class="wk-nav-btn" onclick="WK_OFF++;render()">›</button>
        </div>
      </div>
    </div>
    <div class="grid-wrap">
      <table class="shift-grid">
        <thead><tr>${DAYS.map((dy,i)=>{const dd=new Date(th);dd.setDate(th.getDate()+i);return`<th${i===tc?' class="today-h"':''}>${dy}<br><span style="font-size:9px;opacity:.7;font-weight:400">${dd.getDate()}</span></th>`;}).join('')}<th style="min-width:36px">Hrs</th></tr></thead>
        <tbody><tr>${s.prefs.map((p,di)=>`<td${di===tc?' class="today-col"':''}>${cellHTML(s.id,di,p,false,false)}</td>`).join('')}<td class="hours-cell ${hrs===0?'hours-zero':''}">${fmtH(hrs)}</td></tr></tbody>
      </table>
    </div>
    <div class="legend">
      <div class="legend-item"><div class="legend-dot" style="background:#D97706"></div>Starting 4:00am–12:30pm (8.5h)</div>
      <div class="legend-item"><div class="legend-dot" style="background:#2563EB"></div>Closing 12:30pm–9:30pm (9h)</div>
      <div class="legend-item"><div class="legend-dot" style="background:#7C3AED"></div>Custom hours</div>
    </div>
    <div class="desktop-submit"><button class="btn btn-primary" style="height:46px;padding:0 28px;font-size:15px" onclick="submitPref(${s.id})">Submit my preferences</button></div>
  </div>
  <div class="sticky-bar"><button class="btn btn-primary" onclick="submitPref(${s.id})">Submit my preferences</button></div>`;
}

function renderEmpDone() {
  const s=STAFF.find(x=>x.id===EMP_ID);if(!s)return renderEmpList();
  const hrs=totalHours(s,'p');const canEdit=!isPastDL();
  return`<div class="done-wrap">
    <div class="done-icon">✅</div>
    <div class="done-title">All done, ${s.name.split(' ')[0]}!</div>
    <div class="done-sub">Your preferences have been submitted.</div>
    <div class="done-meta">${fmtH(hrs)} scheduled · ${s.role} · ${s.emp==='FT'?'Full-time':'Part-time'}</div>
    <div class="done-actions">
      ${canEdit?`<button class="btn" style="justify-content:center" onclick="unsubmitPref(${s.id})">✏ Edit my preferences</button>`:`<div class="badge badge-red" style="justify-content:center;padding:6px 12px">Deadline passed — no more edits</div>`}
      <button class="btn" style="justify-content:center" onclick="VIEW='emp-list';render()">← Back to list</button>
      <button class="btn" style="justify-content:center" onclick="VIEW='landing';render()">Home</button>
    </div>
  </div>`;
}

function renderPrefs() {
  const tc=todayCol(),th=getWeekStart(WK_OFF);
  let h='';
  RORD.forEach((role,ri)=>{
    const rs=STAFF.filter(s=>s.role===role),mn=MINS[role]||0;
    h+=`<div class="role-sec" data-ri="${ri}">
      <div class="role-hdr">
        <div class="role-hdr-left">
          <div class="drag-handle"><div class="dh-line"></div><div class="dh-line"></div><div class="dh-line"></div></div>
          <span class="role-name">${role}</span><span class="role-count">${rs.length}</span>
          ${mn>0?`<span class="role-min-badge">min ${mn}</span>`:''}
        </div>
        <div class="role-hdr-right">
          <button class="ord-btn" onclick="moveRole(${ri},-1)" ${ri===0?'disabled':''}>↑</button>
          <button class="ord-btn" onclick="moveRole(${ri},1)" ${ri===RORD.length-1?'disabled':''}>↓</button>
          <button class="btn xs" onclick="startAdd(${ri})">+ Add</button>
        </div>
      </div>
      <div class="grid-wrap"><table class="shift-grid">
        <thead><tr><th class="nc">Name</th>${DAYS.map((dy,i)=>{const dd=new Date(th);dd.setDate(th.getDate()+i);return`<th${i===tc?' class="today-h"':''}>${dy}<br><span style="font-size:9px;opacity:.7;font-weight:400">${dd.getDate()}</span></th>`;}).join('')}<th>Hrs</th><th>Status</th></tr></thead>
        <tbody>`;
    if(rs.length===0&&ADD_RI!==role) h+=`<tr class="empty-row"><td colspan="10">No ${role.toLowerCase()} added yet</td></tr>`;
    else rs.forEach(s=>{
      const hrs=totalHours(s,'p');
      h+=`<tr><td class="nc"><div id="nw${s.id}" class="staff-name-wrap"><span id="nd${s.id}" class="staff-nm" onclick="startEditName(${s.id})">${s.name}</span><span class="badge badge-${s.emp}" onclick="toggleEmpType(${s.id})" style="cursor:pointer;user-select:none" title="Toggle FT/PT">${s.emp}</span><button style="width:16px;height:16px;border:none;background:transparent;cursor:pointer;color:var(--text3);font-size:10px;font-family:var(--font)" onclick="removeStaff(${s.id})">✕</button><button style="height:18px;padding:0 6px;border:1px solid #FECACA;background:#FEF2F2;border-radius:4px;cursor:pointer;color:#991B1B;font-size:9px;font-weight:600;font-family:var(--font);white-space:nowrap;margin-left:2px" onclick="resetPin(${s.id})" title="Reset PIN">Reset PIN</button></div>
        <input id="ni${s.id}" class="staff-nm-inp" value="${s.name.replace(/"/g,'&quot;')}" onblur="saveEditName(${s.id})" onkeydown="if(event.key==='Enter')saveEditName(${s.id});else if(event.key==='Escape')render()">
        <div class="staff-subrole">${s.role}</div></td>
        ${DAYS.map((_,di)=>`<td${di===tc?' class="today-col"':''}>${cellHTML(s.id,di,s.prefs[di],s.sub,false)}</td>`).join('')}
        <td class="hours-cell ${hrs===0?'hours-zero':''}">${fmtH(hrs)}</td>
        <td style="text-align:center">${s.sub?`<span class="status-ok">✓ Done</span>`:`<button class="btn xs" onclick="submitPref(${s.id})">Submit</button>`}</td></tr>`;
    });
    if(ADD_RI===role) h+=`<tr class="add-row"><td class="nc" colspan="2"><input id="addinp" class="add-inp-cell" placeholder="Full name…" onkeydown="if(event.key==='Enter')confirmAdd();else if(event.key==='Escape')cancelAdd()"></td><td colspan="5" style="font-size:11px;color:var(--text3);padding-left:8px">Press Enter to add</td><td colspan="3"><div style="display:flex;gap:4px;justify-content:center"><button class="btn xs btn-primary" onclick="confirmAdd()">Add</button><button class="btn xs" onclick="cancelAdd()">✕</button></div></td></tr>`;
    h+=`</tbody></table></div></div>`;
  });
  const el=document.getElementById('mgr-prefs');if(el)el.innerHTML=h;setupDrag();
}

function renderResults() {
  const th=getWeekStart(WK_OFF);
  const meta=suggMeta();
  const diffHTML=DIFF.length===0?`<div style="font-size:12px;color:var(--green-text);margin-top:8px">✓ All preferences matched exactly — optimal allocation.</div>`:
    `<div style="margin-top:10px"><button class="btn xs" onclick="SHOW_DIFF=!SHOW_DIFF;renderResults()" style="margin-bottom:8px">${SHOW_DIFF?'Hide':'Show'} ${DIFF.length} change${DIFF.length>1?'s':''} ▾</button>
    ${SHOW_DIFF?`<div class="diff-list">${DIFF.map(d=>`<div class="diff-item"><span class="diff-tag ${d.reason==='fi'?'tag-fi':'tag-adj'}">${d.reason==='fi'?'Added to fill':'Shift adjusted'}</span><div style="font-size:12px"><strong>${d.name}</strong> (${d.role}) — ${DAYS[d.day]}: ${d.was&&d.was.type?shiftLabel(d.was):'no preference'} → ${shiftLabel(d.now)}</div></div>`).join('')}</div>`:''}
    </div>`;
  const banner=`<div class="sugg-banner">
    <div class="sugg-title">Suggested allocation — ${wkHeader()}</div>
    <div class="sugg-sub">Generated from submitted preferences and staffing requirements. Use Edit ▾ to override any shift.</div>
    <div class="sugg-stats">
      <span class="sstat ${meta.fd===7?'sstat-ok':'sstat-warn'}">${meta.fd}/7 days fully staffed</span>
      ${meta.adj===0?`<span class="sstat sstat-ok">All preferences honored</span>`:`<span class="sstat sstat-warn">${meta.adj} shift${meta.adj>1?'s':''} adjusted</span>`}
      ${meta.fi>0?`<span class="sstat sstat-info">${meta.fi} added to meet minimums</span>`:''}
      ${meta.fd===7&&meta.adj===0&&meta.fi===0?`<span class="sstat sstat-ok">Optimal ✓</span>`:''}
    </div>${diffHTML}
  </div>`;
  const d=RES_DAY;
  const shCfg={s:{dot:'#D97706',lbl:'Starting shift',time:'4:00am–12:30pm',bg:'#FEF9EE',tx:'#92400E'},c:{dot:'#2563EB',lbl:'Closing shift',time:'12:30pm–9:30pm',bg:'#EFF6FF',tx:'#1D4ED8'},custom:{dot:'#7C3AED',lbl:'Custom shift',time:'custom hours',bg:'#F5F3FF',tx:'#4C1D95'}};
  const tabs=DAYS.map((dy,i)=>{const dd=new Date(th);dd.setDate(th.getDate()+i);const wi=dayHasIssue(i);return`<button class="day-tab${i===d?' act':''}${wi?' warn':''}" onclick="RES_DAY=${i};renderResults()">${dy} ${dd.getDate()}${wi?' ⚠':''}</button>`;}).join('');
  const grps=['s','c','custom'].map(sk=>{
    const sv=shCfg[sk],ins=STAFF.filter(s=>{const p=(ALLOC[s.id]||[])[d];return p&&p.type===sk;});
    const chips=ins.length===0?`<div class="no-staff">No one allocated</div>`:ins.map(s=>{
      const pr=s.prefs[d],al=(ALLOC[s.id]||[])[d];
      const adj=pr&&pr.type&&al&&pr.type!==al.type,fi=(!pr||!pr.type)&&al&&al.type,ov=OVR[s.id]&&OVR[s.id][d];
      return`<div class="staff-chip"><div class="chip-avatar" style="background:${sv.bg};color:${sv.tx}">${initials(s.name)}</div>
        <div class="chip-info"><div class="chip-name" style="display:flex;align-items:center;gap:4px">${s.name}<span class="badge badge-${s.emp}" style="font-size:9px">${s.emp}</span></div>
        <div class="chip-sub">${s.role} · ${fmtH(totalHours(s,'a'))} wk</div></div>
        ${adj?'<span class="chip-tag tag-adj">adjusted</span>':''}${fi?'<span class="chip-tag tag-fi">req.filled</span>':''}${ov?'<span class="chip-tag tag-ovr">override</span>':''}</div>`;
    }).join('');
    const editRows=ins.map(s=>`<div class="edit-alloc-row"><span class="edit-alloc-name">${s.name}</span>${cellHTML(s.id,d,ALLOC[s.id][d],false,true)}</div>`).join('');
    return`<div class="res-card"><div class="res-card-header"><div class="shift-dot" style="background:${sv.dot}"></div><span class="res-card-title">${sv.lbl}</span><span class="res-card-time">${sv.time}</span><span class="res-card-count">${ins.length} staff</span><button class="btn xs" onclick="toggleAlEdit('${sk}${d}')" style="margin-left:4px">Edit ▾</button></div>
      <div>${chips}</div><div class="edit-toggle-wrap" id="aled${sk}${d}">${editRows}</div></div>`;
  }).join('');
  const chk=`<div class="staffing-check"><div class="staffing-check-title">Staffing requirements check</div><div class="staffing-check-grid">${ROLES_DEF.map(r=>{const mn=MINS[r]||0;if(!mn)return'';const hv=STAFF.filter(s=>s.role===r&&(ALLOC[s.id]||[])[d]&&(ALLOC[s.id]||[])[d].type).length;return`<span class="sc-item ${hv>=mn?'sc-ok':'sc-bad'}">${hv>=mn?'✓':'⚠'} ${r}: ${hv}/${mn}</span>`;}).join('')}</div></div>`;
  const off=STAFF.filter(s=>!((ALLOC[s.id]||[])[d]&&(ALLOC[s.id]||[])[d].type));
  const el=document.getElementById('mgr-results');if(el){el.innerHTML=banner+`<div class="day-tabs">${tabs}</div>${grps}${chk}${off.length?`<div class="off-list">Day off: ${off.map(s=>s.name).join(', ')}</div>`:''}`;}
}

function renderMgr() {
  const tot=STAFF.length,done=subCount(),pct=tot>0?Math.round(done/tot*100):0,ha=Object.keys(ALLOC).length>0;
  return`<div>
    <div class="progress" style="padding-top:16px">
      <div class="progress-row">
        <span class="progress-label">${tot===0?'No staff added':done===tot&&tot>0?'All preferences submitted ✓':`${done} of ${tot} submitted`}</span>
        ${DEADLINE?`<span class="badge ${isPastDL()?'badge-red':'badge-amber'}" style="font-size:11px">${isPastDL()?'⛔ Closed':timeUntilDL()||dlLabel()}</span>`:''}
      </div>
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
    </div>
    <div class="toolbar">
      <div class="toolbar-left">
        <button class="btn sm" onclick="VIEW='landing';render()">← Home</button>
        <div class="wk-nav"><button class="wk-nav-btn" onclick="WK_OFF--;render()">‹</button><span class="wk-label">${wkHeader()}</span><button class="wk-nav-btn" onclick="WK_OFF++;render()">›</button></div>
      </div>
      <div class="toolbar-right">
        ${MGR_TAB==='prefs'?`
          <button class="btn sm ${SHOW_REQ?'act':''}" id="req-btn" onclick="toggleReq()">⊞ Min.</button>
          <button class="btn sm ${SHOW_DL?'act':''}" id="dl-btn" onclick="toggleDL()">⏱ Deadline</button>
          <button class="btn sm btn-primary" ${allSubmitted()?'':'disabled'} onclick="calcAndShow()">Calculate</button>
        `:`<button class="btn sm" onclick="MGR_TAB='prefs';render()">← Prefs</button>`}
        ${ha?`<button class="btn sm btn-green" onclick="exportExcel()">⬇ Excel</button><button class="btn sm" onclick="copyText()">⧉ Copy</button>`:''}
        <button class="btn sm" onclick="window.print()">Print</button>
      </div>
    </div>
    <div id="req-wrap" style="display:none">
      <div class="card" style="margin-bottom:14px"><div style="font-size:13px;font-weight:600;margin-bottom:4px">Minimum staff per day</div><div style="font-size:12px;color:var(--text3);margin-bottom:12px">Minimum of each role that must be working on any given day</div><div class="req-grid" id="req-grid"></div></div>
    </div>
    <div id="dl-wrap" style="display:none">
      <div class="card" style="margin-bottom:14px">
        <div style="font-size:13px;font-weight:600;margin-bottom:3px">Submission deadline</div>
        <div style="font-size:12px;color:var(--text3);margin-bottom:12px">Staff cannot submit or edit preferences after this point</div>
        <div style="display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap">
          <div><label class="lbl">Deadline date and time</label><input type="datetime-local" id="dl-inp" value="${DEADLINE||''}" class="dl-inp" onchange="setDeadline(this.value)"></div>
          ${DEADLINE?`<button class="btn sm" onclick="clearDeadline()">Clear</button><span class="badge ${isPastDL()?'badge-red':'badge-amber'}">${isPastDL()?'⛔ Closed':timeUntilDL()||'Set'}</span>`:'<span style="font-size:12px;color:var(--text3)">No deadline set</span>'}
        </div>
      </div>
    </div>
    ${MGR_TAB==='prefs'?`${cuEditorHTML()}<div id="mgr-prefs"></div>`:''}
    ${MGR_TAB==='results'?`${cuEditorHTML()}<div id="mgr-results"></div>`:''}
    <div class="legend">
      <div class="legend-item"><div class="legend-dot" style="background:#D97706"></div>Starting — 4:00am–12:30pm</div>
      <div class="legend-item"><div class="legend-dot" style="background:#2563EB"></div>Closing — 12:30pm–9:30pm</div>
      <div class="legend-item"><div class="legend-dot" style="background:#7C3AED"></div>Custom</div>
      <span class="badge badge-FT">FT</span>
      <span class="badge badge-PT">PT</span>
    </div>
  </div>`;
}

// ─── Main Render ──────────────────────────────────────────────────────
function render() {
  const app=document.getElementById('app');
  const sticky=document.getElementById('sticky-bar-slot');
  if(sticky)sticky.innerHTML='';
  switch(VIEW){
    case 'loading': app.innerHTML=`<div class="loading-wrap"><div class="spinner"></div><div class="loading-txt">Loading…</div></div>`; break;
    case 'landing': app.innerHTML=renderLanding(); break;
    case 'auth': app.innerHTML=renderAuth(); break;
    case 'emp-list': app.innerHTML=renderEmpList(); break;
    case 'emp-pin-create': app.innerHTML=renderEmpPinCreate(); break;
    case 'emp-pin-enter': app.innerHTML=renderEmpPinEnter(); break;
    case 'emp-pin-forgot': app.innerHTML=renderEmpPinForgot(); break;
    case 'emp-form': app.innerHTML=renderEmpForm(); setTimeout(updateCuHours,0); break;
    case 'emp-done': app.innerHTML=renderEmpDone(); break;
    case 'mgr':
      app.innerHTML=renderMgr();
      if(MGR_TAB==='prefs'){renderPrefs();if(SHOW_REQ)renderReqPanel();}
      else renderResults();
      setTimeout(updateCuHours,0); break;
  }
}

// ─── Initialization ───────────────────────────────────────────────────
function withTimeout(promise, ms) {
  return Promise.race([
    promise,
    new Promise((_,rej) => setTimeout(()=>rej(new Error('timeout')), ms))
  ]);
}

async function init() {
  // Test Firebase connectivity (no SDK needed)
  try { await initDB(); } catch(e) { USE_FIREBASE=false; }

  // Load initial data
  try { await withTimeout(loadAll(), 6000); }
  catch(e) { console.warn('Data load error, using defaults:', e); if(!STAFF.length)STAFF=[];if(!RORD.length)RORD=[...ROLES_DEF]; }

  // Start background polling if Firebase is available
  if (USE_FIREBASE) setupListeners();

  VIEW='landing'; render();
}
init();
</script>
